<script type="module">
import * as THREE from 'https://esm.sh/three@0.149.0';
import { OrbitControls } from 'https://esm.sh/three@0.149.0/examples/jsm/controls/OrbitControls.js';
import { createStrobeLightning } from './LightningSystem.js';
import { EffectComposer } from 'https://esm.sh/three@0.149.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://esm.sh/three@0.149.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://esm.sh/three@0.149.0/examples/jsm/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'https://esm.sh/three@0.149.0/examples/jsm/postprocessing/ShaderPass.js';

// ──────────────────────────────────────────────
// CUSTOM POST-PROCESS SHADERS (REVERTED)
// ──────────────────────────────────────────────
const CinematicShader = {
    uniforms: {
        "tDiffuse": { value: null },
        "uVignette": { value: 0.5 },
        "uChromatic": { value: 0.002 },
        "uContrast": { value: 1.1 },
        "uExposure": { value: 1.0 },
        "uTime": { value: 0.0 }
    },
    vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uVignette;
        uniform float uChromatic;
        uniform float uContrast;
        uniform float uExposure;
        uniform float uTime;
        varying vec2 vUv;
        
        float random(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

        void main() {
            vec4 r = texture2D(tDiffuse, vUv + vec2(uChromatic, 0.0));
            vec4 g = texture2D(tDiffuse, vUv);
            vec4 b = texture2D(tDiffuse, vUv - vec2(uChromatic, 0.0));
            vec4 color = vec4(r.r, g.g, b.b, g.a);
            
            // Grain
            float grain = (random(vUv + uTime) - 0.5) * 0.05;
            color.rgb += grain;

            color.rgb = (color.rgb - 0.5) * uContrast + 0.5;
            color.rgb *= uExposure;
            float dist = distance(vUv, vec2(0.5));
            color.rgb *= smoothstep(0.9, uVignette, dist);
            gl_FragColor = color;
        }
    `
};

// ──────────────────────────────────────────────
// NOISE & UTILS
// ──────────────────────────────────────────────
const noiseGLSL = `
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.xxx*2.0;
  vec3 x3=x0-1.0+C.xxx*3.0;
  i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m; return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
`;

const lightningVert = `
${noiseGLSL}
varying vec2 vUv;
varying float vDisplace;
varying float vTension;
varying float vNode;
varying float vDistToCore;
uniform float uTime;
uniform float uDirection;
uniform float uSeed;
uniform float uLayer;
uniform float uClashOffset;

void main(){
    vUv = uv;
    vec3 p = position;
    float t = uTime * 4.0;
    
    // NODOS DE COMPRESIÓN: Acumulación de energía rítmica
    float node = smoothstep(0.4, 0.6, abs(sin(vUv.y * 3.0 + t * 0.2)));
    vNode = node;
    float compression = 1.0 - (node * 0.4);
    
    // COLUMNA PRINCIPAL: Fuerza inevitable
    float macroFreq = (uLayer == 0.0) ? 0.1 : 0.3;
    float macroAmp = (uLayer == 0.0) ? 4.0 : 1.5;
    
    float noise = snoise(vec3(p.y * macroFreq, t * 0.4, uSeed));
    float snappedN = pow(abs(noise), 1.1) * sign(noise); 
    
    // DISTORSIÓN ORBITAL ERRÁTICA: Usamos UV.y para independencia de rotación
    // El núcleo está en vUv.y = 1.0 (mapeado dinámicamente)
    float distToCore = smoothstep(0.4, 1.0, vUv.y);
    vDistToCore = distToCore;
    float gravityPull = pow(distToCore, 2.5);
    
    // Dirección errática de torsión
    float erraticTime = t * 0.1 + snoise(vec3(0.0, t * 0.05, 0.0)) * 2.0;
    float twist = snoise(vec3(0.0, erraticTime, 0.0)) * gravityPull * 6.0;
    
    // Rotación tangencial (Whirlpool en el plano de la sección)
    float cosT = cos(twist);
    float sinT = sin(twist);
    float nx = p.x * cosT - p.z * sinT;
    float nz = p.x * sinT + p.z * cosT;
    p.x = mix(p.x, nx, gravityPull);
    p.z = mix(p.z, nz, gravityPull);
    
    p.x += (snappedN * macroAmp) * compression + snoise(vec3(t * 10.0, erraticTime, 0.0)) * gravityPull * 4.0;
    p.z += (snoise(vec3(p.y * 0.5, t, uSeed + 1.0)) * macroAmp * 0.3 * compression);
    
    vDisplace = snappedN;
    vTension = abs(noise);
    
    // CONVERGENCIA CRÍTICA DINÁMICA: Colapso relativo al punto de choque real
    float tip = (uDirection > 0.0) ? (uClashOffset + 25.0)/50.0 : (25.0 - uClashOffset)/50.0;
    float relProgress = clamp(vUv.y / tip, 0.0, 1.0);
    float tipConvergence = 1.0 - smoothstep(0.9, 1.0, relProgress);
    
    p.x *= tipConvergence;
    p.z *= tipConvergence;

    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;

const lightningFrag = `
${noiseGLSL}
varying vec2 vUv;
varying float vDisplace;
varying float vTension;
varying float vNode;
varying float vDistToCore;
uniform vec3 uColor;
uniform float uTime;
uniform float uDirection;
uniform float uIntensity;
uniform float uClashOffset;
uniform float uBottomOffset; // Nuevo parámetro para el corte trasero

void main(){
    float d = abs(vUv.x - 0.5) * 2.0;
    float t = uTime * 25.0;
    
    // COLUMNA DOMINANTE (Espinazo del rayo)
    float spine = smoothstep(0.02, 0.0, d); // Línea ultra fina e inevitable
    
    // NODOS Y MORDIDAS (Energy Bites)
    float bite = step(0.98, snoise(vec3(vUv.y * 10.0, t * 0.5, 0.0)));
    float n = 1.0 - abs(snoise(vec3(vUv.y * 25.0 + t * uDirection, vUv.x * 4.0, t * 0.2)));
    float sharp = pow(n, 12.0); 
    
    // COMPRESIÓN: El rayo es más denso y brillante en los nodos
    float thickness = 0.005 + vNode * 0.03 + bite * 0.1;
    float collapse = step(0.05, snoise(vec3(vUv.y * 1.5, t * 0.3, 0.0)));
    
    // FRAGMENTACIÓN Y SUFRIMIENTO: El rayo se rompe cerca del núcleo
    float fragmentation = step(0.3, snoise(vec3(vUv.y * (60.0 + uDirection * 20.0), t * 3.0, 0.0))) * pow(vDistToCore, 2.0);
    
    // ROBO DE ENERGÍA Y CORTE DE COLISIÓN
    float energyTheft = smoothstep(0.7, 1.0, vDistToCore);
    
    // CORTE CRÍTICO Y CONVERGENCIA FRAGMENTARIA DINÁMICA
    float tip = (uDirection > 0.0) ? (uClashOffset + 25.0)/50.0 : (25.0 - uClashOffset)/50.0;
    float bottom = (uDirection > 0.0) ? (uBottomOffset + 25.0)/50.0 : (25.0 - uBottomOffset)/50.0;
    
    if(vUv.y > tip || vUv.y < bottom) discard;
    
    float relProgress = clamp(vUv.y / tip, 0.0, 1.0);
    float tipFade = smoothstep(1.0, 0.97, relProgress); 
    
    float mask = smoothstep(thickness * tipFade, 0.0, d - sharp * 0.2) * (1.0 - fragmentation * 0.5);
    
    // El espinazo (spine) vibra con violencia absoluta
    mask = max(mask * collapse, spine * (0.9 + fragmentation * 0.3));
    
    // Glow denso que se colapsa al entrar al centro
    float glowNoise = snoise(vec3(vUv * 15.0, t * 0.1)) * 0.5 + 0.5;
    float glow = exp(-d * 18.0) * (sharp + vNode) * glowNoise * tipFade;
    
    vec3 col = mix(uColor, vec3(35.0), mask + spine);
    
    // Acentos de intensidad (Asimétricos)
    float acc = bite * 15.0 + vNode * 4.0 + fragmentation * 15.0;
    
    // Blur en la cola (atrás hacia adelante)
    float bottomFade = smoothstep(0.0, 0.05, (vUv.y - bottom) / max(0.01, tip - bottom));
    float xFade = smoothstep(0.0, 0.15, vUv.y) * tipFade * bottomFade;
    
    vec3 finalCol = col * (mask * 10.0 + spine * 25.0 + glow * 5.0 + acc);
    finalCol *= uIntensity * 0.55 * (1.0 - energyTheft * 0.2); 

    gl_FragColor = vec4(finalCol, (mask + glow + spine) * xFade);
}`;

// ──────────────────────────────────────────────
// SHADERS REVERTED (CORE, SHOCKWAVE, VOLUMETRIC)
// ──────────────────────────────────────────────
const shockFrag = `
${noiseGLSL}
varying vec2 vUv;
uniform float uTime;
uniform vec3 uColor;
uniform float uRadius;
void main(){
    float d = length(vUv - 0.5);
    float mask = smoothstep(0.5, 0.4, d); 
    float ring = 1.0 - smoothstep(uRadius - 0.05, uRadius, d);
    ring *= smoothstep(uRadius - 0.08, uRadius - 0.05, d);
    float n1 = snoise(vec3(vUv * 10.0, uTime * 0.5));
    float n2 = snoise(vec3(vUv * 20.0, uTime));
    float chaos = smoothstep(0.2, 0.8, n1 * n2); 
    vec3 col = mix(uColor, vec3(1.0), 0.5);
    float alpha = ring * chaos * (1.0 - uRadius) * mask * 0.4;
    gl_FragColor = vec4(col * 5.0, alpha);
}`;

const volFrag = `
${noiseGLSL}
varying vec2 vUv;
uniform float uTime;
uniform vec3 uColor;
void main(){
    float d = length(vUv - 0.5);
    float n = snoise(vec3(vUv * 2.0, uTime * 0.1));
    float alpha = smoothstep(0.48, 0.1, d) * (n * 0.5 + 0.5) * 0.05;
    gl_FragColor = vec4(uColor * 2.0, alpha);
}`;

const coreVert = `
${noiseGLSL}
varying vec3 vPos;
uniform float uTime;
void main(){
    vec3 p = position;
    float t = uTime * 15.0;
    
    // DEFORMACIÓN MACRO ERRÁTICA
    float erraticT = t * 0.2 + snoise(p * 0.5 + t * 0.1) * 3.0;
    float noiseL = snoise(p * 1.5 + erraticT); 
    float noiseH = snoise(p * 6.0 - t * 0.4); 
    
    float deformation = noiseL * 0.5 + noiseH * 0.1;
    p += normalize(p) * deformation;
    
    vPos = p;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;

const coreFrag = `
${noiseGLSL}
varying vec3 vPos;
uniform float uTime;
uniform vec3 uColor1;
uniform vec3 uColor2;
void main(){
    float t = uTime * 45.0;
    vec3 p = vPos;
    float d = length(p) / 1.3;
    
    // ASIMETRÍA Y DESBALANCE ERRÁTICO
    float erraticTime = t * 0.1 + snoise(p * 0.2 + t * 0.05) * 5.0;
    float shift = snoise(vec3(p.xy * 0.4, erraticTime));
    float dOffset = d + shift * 0.15;
    
    // TRANSPARENCIA INCOHERENTE: El núcleo se abre y pierde masa
    float flicker = step(0.4, snoise(vec3(p * 2.0 + t * 0.1)));
    float edgeNoise = snoise(p * 4.0 - t * 0.1);
    float alphaMask = smoothstep(1.7 + edgeNoise * 0.5, 0.0, dOffset) * mix(0.7, 1.0, flicker);
    
    // MICRO-CONTRASTE INTERNO (Evitando el white-blob)
    float n1 = snoise(p * 18.0 + t * 0.3);
    float microFracture = pow(1.0 - abs(n1), 40.0);
    float heart = exp(-dOffset * 15.0) * mix(0.2, 1.0, microFracture); 
    
    // GRIETAS DIMENSIONALES (Filo y nitidez)
    float crackPattern = pow(1.0 - abs(snoise(p * 10.0 + t * 0.2)), 30.0);
    
    // VACÍOS DE COMPRESIÓN AGRESIVOS
    float voids = step(0.55, abs(snoise(p * 5.0 - t * 0.04 + shift)));
    
    // STARBURST: Rayos rotativos internos (Inspirado en gotas.html)
    float angle = atan(p.z, p.x);
    float rays1 = sin(angle * 8.0 + t * 4.0) * 0.5 + 0.5;
    float rays2 = sin(angle * 12.0 - t * 3.0) * 0.5 + 0.5;
    float starburst = pow(rays1 * rays2, 3.0) * smoothstep(1.1, 0.0, dOffset);
    
    vec3 col = mix(uColor1, uColor2, p.x * 0.5 + 0.5 + shift * 0.4);
    
    // Composición de "Evento Prohibido"
    col = mix(col, vec3(0.0), voids * 0.9); // Sombras de gravedad
    col += vec3(280.0) * heart; // Corazón ultra-hot pero estructurado
    col += vec3(140.0) * crackPattern * (1.1 - dOffset); // Rupturas de tensión
    col += vec3(50.0) * starburst; // Rayos rotativos de energía
    
    // Ejecciones asimétricas
    float filaments = pow(abs(snoise(vec3(atan(p.z, p.x) * 4.0, p.y * 2.0, t * 0.3))), 8.0);
    col += uColor2 * filaments * 4.0 * (1.5 - dOffset);
    // Foco de sobreexposición muy ceñido (Filo)
    col += vec3(60.0) * exp(-dOffset * 30.0) * microFracture;

    gl_FragColor = vec4(col, alphaMask);
}
`;

// ──────────────────────────────────────────────
// LIQUID BAR SYSTEM (Ported from pantalla.html)
// ──────────────────────────────────────────────
class LiquidBar {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.W = this.canvas.parentElement.clientWidth;
        this.H = this.canvas.parentElement.clientHeight;
        this.canvas.width = this.W;
        this.canvas.height = this.H;
        this.targetHp = 1.0;
        this.displayHp = 1.0;
        this.shakeAmt = 0;
        this.waves = [
            { ph: 0,   sp: 0.009,  amp: 2.8, fr: 0.018 },
            { ph: 1.3, sp: -0.007, amp: 2.0, fr: 0.031 },
            { ph: 3.1, sp: 0.011,  amp: 1.3, fr: 0.055 }
        ];
        this.particles = [];
    }
    lerpColor(a, b, t) {
        const ah = parseInt(a.slice(1), 16), ar = ah >> 16, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
        const bh = parseInt(b.slice(1), 16), br = bh >> 16, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
        return `rgb(${Math.round(ar+t*(br-ar))},${Math.round(ag+t*(bg-ag))},${Math.round(ab+t*(bb-ab))})`;
    }
    getTheme(p) {
        if (p >= 0.55) return { c1:'#0d1f0d', c2:'#112211', c3:'#0a3320', edge:'#1a7a44' };
        if (p >= 0.25) return { c1:'#1a0e00', c2:'#221400', c3:'#3a1e00', edge:'#9a5500' };
        return { c1:'#1a0000', c2:'#2a0000', c3:'#3d0000', edge:'#aa1010' };
    }
    waveY(x, baseY, extraAmp) {
        let y = baseY;
        for (const w of this.waves) y += Math.sin(x * w.fr + w.ph) * (w.amp + extraAmp);
        return y;
    }
    drawLayer(baseY, offsetY, color, extraAmp) {
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.H);
        this.ctx.lineTo(0, this.waveY(0, baseY + offsetY, extraAmp));
        for (let x = 1; x <= this.W; x += 2) this.ctx.lineTo(x, this.waveY(x, baseY + offsetY, extraAmp));
        this.ctx.lineTo(this.W, this.H);
        this.ctx.fillStyle = color;
        this.ctx.fill();
    }
    setHealth(hp) {
        if (hp < this.targetHp) this.shakeAmt = 8;
        this.targetHp = hp;
    }
    update() {
        this.displayHp += (this.targetHp - this.displayHp) * 0.1;
        this.shakeAmt *= 0.88;
        for (const w of this.waves) w.ph += w.sp;
        const th = this.getTheme(this.displayHp);
        const baseY = (this.H + 20) * (1 - this.displayHp) - 10 + (Math.random()-0.5) * this.shakeAmt;
        this.ctx.clearRect(0, 0, this.W, this.H);
        const extraAmp = this.shakeAmt * 0.15;
        this.drawLayer(baseY, 10, th.c1, extraAmp);
        this.drawLayer(baseY,  5, th.c2, extraAmp);
        this.drawLayer(baseY,  0, th.c3, extraAmp);
    }
}

// ──────────────────────────────────────────────
// ENGINE INITIALIZATION
// ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 35); // Posición lateral elevada para mejor profundidad
camera.lookAt(0, 0, 0);

// Controles desactivados para vista cinemática fija
// const controls = new OrbitControls(camera, renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 3.5, 0.4, 0.85);
bloomPass.threshold = 0.1;
bloomPass.strength = 2.5;
composer.addPass(bloomPass);

const cinematicPass = new ShaderPass(CinematicShader);
composer.addPass(cinematicPass);

// Initial bars (will be started in connectManual)
let barP1, barP2;

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

// ----------------------------------------------------------------
// SOCKET & SIGNALING (Ported from pantalla.html)
// ----------------------------------------------------------------
const socket = io();
const colorMap = { 'expelliarmus': 0xbf40ff, 'accio': 0xffffff, 'desmaius': 0xff1100, 'protego': 0x00ffff };
let roomId = new URLSearchParams(window.location.search).get('room');

window.connectManual = () => {
    const id = document.getElementById('manual-room').value.trim().toUpperCase() || localStorage.getItem('lastRoomId');
    if (id) { 
        roomId = id;
        localStorage.setItem('lastRoomId', id);
        socket.emit('screen-join', roomId); 
        document.getElementById('waiting').style.display='none'; 
        initBars();
    }
};

if (roomId) { 
    document.getElementById('manual-room').value = roomId; 
    window.connectManual(); 
}

function initBars() {
    barP1 = new LiquidBar('liq-p1');
    barP2 = new LiquidBar('liq-p2');
}

socket.on('game-event', (data) => {
    if (data.event === 'spell') {
        const color = colorMap[data.tipo] || 0xffffff;
        if (data.jugador === 1) {
            spellL_active = true; 
            progressL = 0; 
            progressBottomL = 0;
            beamL.mats.forEach(m => m.uniforms.uColor.value.set(color));
            strobeMatL.uniforms.uColor.value.set(color);
        } else {
            spellR_active = true; 
            progressR = 0; 
            progressBottomR = 0;
            beamR.mats.forEach(m => m.uniforms.uColor.value.set(color));
            strobeMatR.uniforms.uColor.value.set(color);
        }
    } else if (data.event === 'health-update') {
        if (data.jugador === 1) barP1?.setHealth(data.health / 100);
        else barP2?.setHealth(data.health / 100);
    } else if (data.event === 'motion') {
        if (isClashing) {
            // El movimiento del celular afecta el desplazamiento del choque
            const force = data.valor * 0.05;
            targetOffset += (data.jugador === 1 ? force : -force);
            targetOffset = Math.max(-15, Math.min(15, targetOffset));
        }
    } else if (data.event === 'clash-start') {
        isClashing = true;
    } else if (data.event === 'clash-end') {
        isClashing = false;
        spellL_active = false;
        spellR_active = false;
    } else if (data.event === 'rematch') {
        barP1?.setHealth(1.0);
        barP2?.setHealth(1.0);
        isClashing = false;
        spellL_active = false;
        spellR_active = false;
        clashOffset = 0;
        targetOffset = 0;
    }
});

// ──────────────────────────────────────────────
// CLASSES & OBJECTS
// ──────────────────────────────────────────────

class MagicalBeam {
    constructor(color, direction, posX, rotZ) {
        this.group = new THREE.Group();
        this.mats = [];
        this.addLayer(0.2, color, direction, 0); 
        this.addLayer(0.4, color, direction, 1);
        this.addLayer(0.6, color, direction, 2);
        this.group.position.set(posX, 0, 0);
        this.group.rotation.z = rotZ;
        scene.add(this.group);
    }
    addLayer(radius, color, direction, layerId) {
        const mat = new THREE.ShaderMaterial({
            vertexShader: lightningVert,
            fragmentShader: lightningFrag,
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(color) },
                uDirection: { value: direction },
                uLayer: { value: layerId },
                uSeed: { value: Math.random() * 100 },
                uIntensity: { value: 3.5 },
                uClashOffset: { value: 0 },
                uBottomOffset: { value: -25 }
            },
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
        });
        const geo = new THREE.CylinderGeometry(radius, radius, 50, 16, 512, true);
        const mesh = new THREE.Mesh(geo, mat);
        this.group.add(mesh);
        this.mats.push(mat);
    }
    update(t, intensity, offset, bottom) {
        this.mats.forEach(m => {
            m.uniforms.uTime.value = t;
            m.uniforms.uIntensity.value = 3.5 + intensity;
            m.uniforms.uClashOffset.value = offset;
            m.uniforms.uBottomOffset.value = bottom;
        });
    }
}

const colL = '#0066ff'; // Deep Cobalt
const colR = '#ff5500'; // Intense Ember
const beamL = new MagicalBeam(colL, 1, 0, -Math.PI/2);
const beamR = new MagicalBeam(colR, -1, 0, Math.PI/2);

const coreMat = new THREE.ShaderMaterial({
    vertexShader: coreVert,
    fragmentShader: coreFrag,
    uniforms: { uTime: {value:0}, uColor1: {value:new THREE.Color(colL)}, uColor2: {value:new THREE.Color(colR)} },
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3, 15), coreMat);
scene.add(core);

// Volumetrics removed for curation. Focus is now on the singularity.

// Sparks (Reinstate with Gravity & Gooey Physics)
const sparks = new THREE.Points(
    new THREE.BufferGeometry(),
    new THREE.ShaderMaterial({
        vertexShader: `
            uniform float uTime;
            attribute vec3 aVel;
            attribute float aOff;
            attribute float aOriginX;
            varying float vLife;
            void main(){
                float t = mod(uTime * 0.8 + aOff, 2.0);
                vLife = smoothstep(2.0, 1.5, t) * smoothstep(0.0, 0.2, t);
                
                // Física: p = p0 + v*t + 0.5*g*t^2
                // p0 es ahora la posición donde nació la partícula (aOriginX)
                vec3 p = vec3(aOriginX, 0.0, 0.0);
                p += aVel * t * 15.0;
                p.y -= 9.8 * 0.5 * t * t; // Gravedad constante
                
                vec4 mv = modelViewMatrix * vec4(p, 1.0);
                gl_PointSize = (120.0 / -mv.z) * vLife;
                gl_Position = projectionMatrix * mv;
            }
        `,
        fragmentShader: `
            varying float vLife;
            uniform vec3 uColor;
            void main(){
                float d = length(gl_PointCoord.xy - 0.5);
                if(d > 0.5) discard;
                // Partícula tipo "gota" brillante
                float glow = exp(-d * 6.0);
                gl_FragColor = vec4(uColor * 15.0, vLife * glow);
            }
        `,
        uniforms: { 
            uTime: {value:0}, 
            uColor: {value:new THREE.Color(colR)}
        },
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    })
);
const COUNT = 1200;
const sP = new Float32Array(COUNT * 3);
const sV = new Float32Array(COUNT * 3);
const sO = new Float32Array(COUNT);
const sOr = new Float32Array(COUNT); // Origin X storage
const lastT = new Float32Array(COUNT); // Cycle tracker
for(let i=0; i<COUNT; i++) {
    // Erupción radial desde el centro
    const speed = 0.5 + Math.random() * 1.5;
    const phi = Math.random() * Math.PI * 2;
    const theta = (Math.random() - 0.5) * Math.PI;
    sV[i*3] = speed * Math.cos(theta) * Math.cos(phi);
    sV[i*3+1] = speed * Math.sin(theta);
    sV[i*3+2] = speed * Math.cos(theta) * Math.sin(phi);
    sO[i] = Math.random() * 5.0;
    sOr[i] = 0;
}
sparks.geometry.setAttribute('position', new THREE.BufferAttribute(sP, 3));
sparks.geometry.setAttribute('aVel', new THREE.BufferAttribute(sV, 3));
sparks.geometry.setAttribute('aOff', new THREE.BufferAttribute(sO, 1));
sparks.geometry.setAttribute('aOriginX', new THREE.BufferAttribute(sOr, 1));
scene.add(sparks);

// Shockwaves (Reinstated)
const shockwaves = [];
let nextShock = 0;
function spawnShockwave() {
    const geo = new THREE.PlaneGeometry(25, 25);
    const mat = new THREE.ShaderMaterial({
        vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: shockFrag,
        uniforms: { uTime: {value:0}, uColor: {value:new THREE.Color(Math.random()>0.5?colL:colR)}, uRadius: {value:0} },
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.x = clashOffset; // Seguir al núcleo
    scene.add(mesh);
    shockwaves.push({ mesh, mat, radius: 0 });
}

const strobeMatL = createStrobeLightning(scene, colL, 1.0);
const strobeMatR = createStrobeLightning(scene, colR, -1.0);

// ESTADO DE DUELO
let isClashing = false;
let spellL_active = false;
let spellR_active = false;
let progressL = 0; 
let progressR = 0; 
let progressBottomL = 0; 
let progressBottomR = 0;
const speed = 0.035;
const fadeSpeed = 0.05;

// CONTROL DE CHOQUE
let clashOffset = 0;
let targetOffset = 0;

window.addEventListener('keydown', (e) => {
    if (isClashing) {
        if(e.key === 'ArrowLeft') targetOffset -= 2.0;
        if(e.key === 'ArrowRight') targetOffset += 2.0;
        targetOffset = Math.max(-15, Math.min(15, targetOffset));
    } else {
        if(e.key === 'ArrowRight' && !spellL_active) { spellL_active = true; progressL = 0; progressBottomL = 0; }
        if(e.key === 'ArrowLeft' && !spellR_active) { spellR_active = true; progressR = 0; progressBottomR = 0; }
    }
});

// LOOP
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    
    // 1. DETECCIÓN DE COLISIÓN
    let currentPosL = -25 + (progressL * 50);
    let currentPosR = 25 - (progressR * 50);
    let bottomPosL = -25 + (progressBottomL * 50);
    let bottomPosR = 25 - (progressBottomR * 50);

    if (!isClashing && spellL_active && spellR_active && progressBottomL < 0.1 && progressBottomR < 0.1) {
        if (currentPosL >= currentPosR) {
            isClashing = true;
            clashOffset = (currentPosL + currentPosR) / 2;
            targetOffset = clashOffset;
        }
    }

    // 2. LÓGICA DE MOVIMIENTO / COLISIÓN
    let intensity = 0;
    let pulse = 0;

    if (isClashing) {
        clashOffset += (targetOffset - clashOffset) * 0.05;
        const organicPulse = (Math.sin(t * 12.0) * 0.5 + Math.sin(t * 22.0) * 0.3 + Math.sin(t * 7.5) * 0.2);
        const spikes = Math.pow(Math.max(0, Math.sin(t * 5.0 + Math.sin(t * 20.0))), 10.0) * 2.0;
        pulse = Math.pow(Math.max(0, organicPulse * 0.5 + 0.5), 4.0) + spikes;
        intensity = 1.0 + pulse * 2.5;

        core.visible = true;
        core.position.x = clashOffset;
        core.scale.setScalar(1.0 + pulse * 0.1);
        sparks.visible = true;
    } else {
        core.visible = false;
        sparks.visible = false;
        
        if (spellL_active) {
            if (progressL < 1.0) progressL += speed;
            else if (progressBottomL < 1.0) progressBottomL += fadeSpeed;
            else { spellL_active = false; progressL = 0; progressBottomL = 0; }
        }
        if (spellR_active) {
            if (progressR < 1.0) progressR += speed;
            else if (progressBottomR < 1.0) progressBottomR += fadeSpeed;
            else { spellR_active = false; progressR = 0; progressBottomR = 0; }
        }
    }

    // 3. ACTUALIZACIÓN DE MATERIALES
    let cutL = isClashing ? clashOffset : currentPosL;
    let btmL = isClashing ? -25 : bottomPosL;
    beamL.update(t, isClashing ? intensity : 2.0, cutL, btmL);
    strobeMatL.uniforms.uTime.value = t;
    strobeMatL.uniforms.uClashOffset.value = cutL;
    strobeMatL.uniforms.uBottomOffset.value = btmL;
    strobeMatL.uniforms.uIntensity.value = spellL_active ? 1.0 : 0.0;

    let cutR = isClashing ? clashOffset : currentPosR;
    let btmR = isClashing ? 25 : bottomPosR;
    beamR.update(t, isClashing ? intensity : 2.0, cutR, btmR);
    strobeMatR.uniforms.uTime.value = t;
    strobeMatR.uniforms.uClashOffset.value = cutR;
    strobeMatR.uniforms.uBottomOffset.value = btmR;
    strobeMatR.uniforms.uIntensity.value = spellR_active ? 1.0 : 0.0;

    coreMat.uniforms.uTime.value = t;
    
    // Shockwaves
    if(isClashing && t > nextShock) { spawnShockwave(); nextShock = t + 5.0 + Math.random() * 10.0; }
    for(let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.radius += 0.015;
        s.mat.uniforms.uRadius.value = s.radius;
        s.mat.uniforms.uTime.value = t;
        s.mesh.quaternion.copy(camera.quaternion);
        if(s.radius > 1.2) { scene.remove(s.mesh); shockwaves.splice(i, 1); }
    }
    
    cinematicPass.uniforms.uExposure.value = 0.9 + (isClashing ? pulse * 0.4 : 0);
    cinematicPass.uniforms.uChromatic.value = 0.001 + (isClashing ? pulse * 0.01 : 0);
    cinematicPass.uniforms.uTime.value = t;
    
    if (isClashing) {
        const attrOr = sparks.geometry.attributes.aOriginX;
        for(let i=0; i<COUNT; i++) {
            const curT = (t * 0.8 + sO[i]) % 2.0;
            if(curT < lastT[i]) {
                attrOr.array[i] = clashOffset;
                attrOr.needsUpdate = true;
            }
            lastT[i] = curT;
        }
    }

    sparks.material.uniforms.uTime.value = t;
    if (barP1) barP1.update();
    if (barP2) barP2.update();
    // controls.update(); // Desactivado
    composer.render();
}
animate();
</script>

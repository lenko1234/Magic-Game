<html lang="es">
<head>

    <title>Magic WebRTC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }

    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* ---- LOBBY ---- */
        #lobby {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #0a0a0a;
        }

        /* ---- COMBAT ---- */
        #combat {
            display: none;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #010405;
        }

        .btn-incorrect {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
            padding: 12px 20px;
            border-radius: 999px;
            font-weight: bold;
            font-size: 14px;
            z-index: 2000;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        .btn-incorrect:active {
            background: rgba(239, 68, 68, 0.5);
            transform: translateX(-50%) scale(0.95);
        }

        .glow-overlay {
            position: absolute;
            top: -450px;
            left: 50%;
            transform: translate3d(-50%, 0, 0);
            width: 200%;
            height: 900px;
            /* El radial-gradient ya tiene bordes suaves incorporados.
               filter:blur() de 120px mataba las transiciones en mobile:
               el GPU no podía animar la opacidad frame a frame mientras
               recalculaba el blur, así que la luz "saltaba" de golpe. */
            background: radial-gradient(circle at center, rgba(147, 51, 234, 0.85) 0%, rgba(147, 51, 234, 0.35) 35%, rgba(147, 51, 234, 0.1) 60%, transparent 80%);
            opacity: 0;
            will-change: opacity, transform;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 0;
        }

        #combat.is-illuminated .glow-overlay {
            opacity: 1;
            transform: translate3d(-50%, 60px, 0);
        }

        #spell-status {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            text-align: center;
        }
        #spell-label {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.8);
        }
        #spell-status.visible { opacity: 1; }

        /* ---- CLASH UI ---- */
        #clash-scene {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            z-index: 50;
        }
        #clash-scene.visible { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #bolt { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; pointer-events: none; }
        
        #clash-canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 40;
        }
        
        .ui-container {
            position: absolute;
            bottom: 80px; left: 0; width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 60;
        }
        #bar-container {
            width: 80%; max-width: 400px; height: 15px;
            background: rgba(0,0,0,0.5);
            margin: 0 auto; border-radius: 10px;
            overflow: hidden; border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        #bar-fill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            transition: width 0.1s linear, background 0.3s ease;
        }
        #clash-msg { margin-top: 15px; font-weight: bold; font-size: 1.5rem; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); color: white; }

        .btn-spell { transition: transform 0.1s ease; }
        .btn-spell:active { transform: scale(0.9); }

        #health-bar-container {
            position: fixed;
            bottom: 20px;
            left: 5%;
            width: 90%;
            height: 28px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            z-index: 100;
        }
        #health-bar-container canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 14px; /* Asegura que el canvas también siga el redondeo */
        }

        #connection-status {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
            z-index: 100;
            letter-spacing: 0.05em;
        }

        /* ---- END SCREEN ---- */
        #end-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #050505;
        }
        #end-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 210;
            text-align: center;
            pointer-events: none;
        }
        #end-status-text {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 12px;
            text-shadow: 0 0 30px currentColor;
            margin-bottom: 1rem;
        }
        #btn-restart {
            pointer-events: auto;
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>

<script>

// ----------------------------------------------------------------
// ESTADO GLOBAL
// ----------------------------------------------------------------
class LiquidBar {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.W = this.canvas.parentElement.clientWidth;
        this.H = this.canvas.parentElement.clientHeight;
        this.canvas.width = this.W;
        this.canvas.height = this.H;
        
        this.targetHp = 1.0;
        this.displayHp = 1.0;
        this.shakeAmt = 0;
        
        this.waves = [
            { ph: 0,   sp: 0.009,  amp: 2.8, fr: 0.018 },
            { ph: 1.3, sp: -0.007, amp: 2.0, fr: 0.031 },
            { ph: 3.1, sp: 0.011,  amp: 1.3, fr: 0.055 },
            { ph: 5.0, sp: -0.005, amp: 0.8, fr: 0.09  },
            { ph: 0.7, sp: 0.017,  amp: 0.5, fr: 0.14  },
        ];
        
        this.bubbles = [];
        for (let i = 0; i < 12; i++) {
            this.bubbles.push({ x: Math.random()*this.W, y: this.H+Math.random()*this.H, r: 1+Math.random()*2, sp: 0.2+Math.random()*0.4, drift: (Math.random()-0.5)*0.2 });
        }
        this.particles = [];
        this.animFrame = null;
    }
    
    lerpColor(a, b, t) {
        const ah = parseInt(a.slice(1), 16), ar = ah >> 16, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
        const bh = parseInt(b.slice(1), 16), br = bh >> 16, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
        const rr = ar + t * (br - ar), rg = ag + t * (bg - ag), rb = ab + t * (bb - ab);
        return `rgb(${Math.round(rr)},${Math.round(rg)},${Math.round(rb)})`;
    }

    lerpTheme(thA, thB, t) {
        return {
            c1: this.lerpColor(thA.c1, thB.c1, t),
            c2: this.lerpColor(thA.c2, thB.c2, t),
            c3: this.lerpColor(thA.c3, thB.c3, t),
            edge: this.lerpColor(thA.edge, thB.edge, t)
        };
    }

    getTheme(p) {
        const high = { c1:'#0d1f0d', c2:'#112211', c3:'#0a3320', edge:'#1a7a44' };
        const mid  = { c1:'#1a0e00', c2:'#221400', c3:'#3a1e00', edge:'#9a5500' };
        const low  = { c1:'#1a0000', c2:'#2a0000', c3:'#3d0000', edge:'#aa1010' };
        
        if (p >= 0.55) return this.lerpTheme(mid, high, (p - 0.55) / 0.45);
        if (p >= 0.25) return this.lerpTheme(low, mid, (p - 0.25) / 0.30);
        return low;
    }
    
    waveY(x, baseY, extraAmp) {
        let y = baseY;
        for (const w of this.waves) y += Math.sin(x * w.fr + w.ph) * (w.amp + extraAmp);
        return y;
    }
    
    addParticles(x, y, theme, n) {
        for (let i = 0; i < n; i++) {
            const a = -Math.PI/2 + (Math.random()-0.5)*1.4;
            const sp = 0.8 + Math.random()*2.5;
            this.particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, r: 1.5+Math.random()*2.5, col: theme.edge, decay: 0.025+Math.random()*0.035 });
        }
    }
    
    drawLayer(baseY, offsetY, color, extraAmp) {
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.H);
        this.ctx.lineTo(0, this.waveY(0, baseY + offsetY, extraAmp));
        for (let x = 1; x <= this.W; x += 2) this.ctx.lineTo(x, this.waveY(x, baseY + offsetY, extraAmp));
        this.ctx.lineTo(this.W, this.H);
        this.ctx.closePath();
        this.ctx.fillStyle = color;
        this.ctx.fill();
    }
    
    setHealth(hp) {
        if (hp < this.targetHp) {
            this.shakeAmt = 8;
            const th = this.getTheme(hp);
            const baseY = (this.H + 20) * (1 - hp) - 10;
            this.addParticles(this.W*0.4 + Math.random()*this.W*0.2, baseY + 4, th, 9);
        }
        this.targetHp = hp;
    }
    
    update() {
        this.displayHp += (this.targetHp - this.displayHp) * 0.10;
        if (Math.abs(this.targetHp - this.displayHp) < 0.001) this.displayHp = this.targetHp;
        this.shakeAmt *= 0.88;
        for (const w of this.waves) w.ph += w.sp;
        const th = this.getTheme(this.displayHp);
        const baseY = (this.H + 20) * (1 - this.displayHp) - 10 + (Math.random()-0.5) * this.shakeAmt;
        this.ctx.clearRect(0, 0, this.W, this.H);
        const extraAmp = this.shakeAmt * 0.15;
        this.drawLayer(baseY, 10, th.c1, extraAmp);
        this.drawLayer(baseY,  5, th.c2, extraAmp);
        this.drawLayer(baseY,  0, th.c3, extraAmp);
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.waveY(0, baseY, extraAmp));
        for (let x = 1; x <= this.W; x += 2) this.ctx.lineTo(x, this.waveY(x, baseY, extraAmp));
        this.ctx.strokeStyle = th.edge;
        this.ctx.lineWidth = 1;
        this.ctx.globalAlpha = 0.55;
        this.ctx.stroke();
        this.ctx.globalAlpha = 1;
        for (const b of this.bubbles) {
            const surfY = this.waveY(b.x, baseY, extraAmp);
            if (b.y > surfY + 1 && b.y < this.H) {
                this.ctx.beginPath();
                this.ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                this.ctx.strokeStyle = th.edge;
                this.ctx.lineWidth = 0.5;
                this.ctx.globalAlpha = 0.2;
                this.ctx.stroke();
                this.ctx.globalAlpha = 1;
            }
            b.y -= b.sp;
            b.x += b.drift;
            if (b.y < baseY - 4 || b.y < 0) {
                b.y = this.H + Math.random()*20;
                b.x = Math.random() * this.W;
            }
        }
        this.particles = this.particles.filter(p => p.life > 0.02);
        for (const p of this.particles) {
            p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= p.decay;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, Math.max(0.1, p.r * p.life), 0, Math.PI*2);
            this.ctx.fillStyle = p.col;
            this.ctx.globalAlpha = p.life * 0.8;
            this.ctx.fill();
            this.ctx.globalAlpha = 1;
        }
        if (this.displayHp < 0.25) {
            const intensity = (0.25 - this.displayHp) / 0.25;
            if (Math.random() < intensity * 0.12) {
                this.shakeAmt = Math.max(this.shakeAmt, 3 + intensity * 5);
                const th2 = this.getTheme(this.displayHp);
                this.addParticles(Math.random()*this.W, this.waveY(Math.random()*this.W, baseY, extraAmp), th2, 2);
            }
        }
    }

    start() {
        const loop = () => {
            this.update();
            this.animFrame = requestAnimationFrame(loop);
        };
        loop();
    }
}

class ClashLightning {
    constructor() {
        this.sceneContainer = document.getElementById('clash-scene');
        this.canvasContainer = document.getElementById('clash-canvas-container');
        this.active = false;
        this.stress = 0;
        this.targetStress = 0;
        
        // Evitamos duplicar el renderer si ya existe
        if (this.canvasContainer.querySelector('canvas')) {
            this.canvasContainer.innerHTML = '';
        }

        // Dynamically load the exact code
        this.initThreeJS();
    }
    
    async initThreeJS() {
        // Load dependencies dynamically from esm.sh to match lightningmobile.html exactly
        const THREE = await import('https://esm.sh/three@0.149.0');
        const { createStrobeLightning, MagicalBeam, CinematicShader } = await import('./core/LightningSystem.js');
        const { EffectComposer } = await import('https://esm.sh/three@0.149.0/examples/jsm/postprocessing/EffectComposer.js');
        const { RenderPass } = await import('https://esm.sh/three@0.149.0/examples/jsm/postprocessing/RenderPass.js');
        const { UnrealBloomPass } = await import('https://esm.sh/three@0.149.0/examples/jsm/postprocessing/UnrealBloomPass.js');
        const { ShaderPass } = await import('https://esm.sh/three@0.149.0/examples/jsm/postprocessing/ShaderPass.js');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        this.canvasContainer.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 3.0, 0.1, 0.85);
        composer.addPass(bloomPass);

        const cinematicPass = new ShaderPass(CinematicShader);
        composer.addPass(cinematicPass);

        const col = '#00f2ff';
        const lightningContainer = new THREE.Group();
        lightningContainer.rotation.z = Math.PI / 2;
        scene.add(lightningContainer);

        const beam = new MagicalBeam(lightningContainer, col, 1.0, 0, -Math.PI / 2);
        const strobeMat = createStrobeLightning(lightningContainer, col, 1.0);

        const clock = new THREE.Clock();

        this.animateFn = () => {
            if (!this.active) return;
            this.animFrame = requestAnimationFrame(this.animateFn);
            
            // TIEMPO ACELERADO: El rayo se mueve más rápido con el estrés
            const timeScale = 1.0 + this.stress * 2.5; 
            const delta = clock.getDelta() * timeScale;
            this.internalTime = (this.internalTime || 0) + delta;
            const t = this.internalTime;

            this.stress += (this.targetStress - this.stress) * 0.15;
            if (Math.abs(this.targetStress - this.stress) < 0.001) this.stress = this.targetStress;
            this.targetStress *= 0.96;

            // Flicker de alta frecuencia cuando hay mucho estrés
            const highFreqFlicker = Math.random() > (0.95 - this.stress * 0.5) ? 2.0 : 1.0;
            const pulse = Math.pow(Math.sin(t * 15.0) * 0.5 + 0.5, 4.0);
            
            const crazyFactor = 1.0 + this.stress * 3.0;
            const gameplayIntensity = (1.0 + pulse * 4.0) * crazyFactor * highFreqFlicker;

            beam.update(t, gameplayIntensity, 25, -25);

            strobeMat.uniforms.uTime.value = t;
            strobeMat.uniforms.uClashOffset.value = 25;
            strobeMat.uniforms.uBottomOffset.value = -25;
            strobeMat.uniforms.uIntensity.value = (1.0 + this.stress * 4.0) * highFreqFlicker;
            
            cinematicPass.uniforms.uTime.value = t;
            
            bloomPass.strength = 3.0 + this.stress * 8.0;
            bloomPass.radius = 0.1 + this.stress * 1.0;

            // SHAKE CONTROLADO: Bajamos la amplitud para evitar el efecto de "duplicado" visual
            // pero mantenemos la violencia con alta frecuencia
            const shakeAmt = (pulse * 0.05 + this.stress * 0.4); 
            camera.position.x = Math.sin(t * 100.0) * shakeAmt; 
            camera.position.y = Math.cos(t * 100.0) * shakeAmt;
            camera.position.z = 22 + (Math.random() - 0.5) * this.stress * 0.5;

            composer.render();

            const fill = document.getElementById('bar-fill');
            if (fill) fill.style.background = this.stress > 0.6 ? 'linear-gradient(90deg,#7f1d1d,#ef4444)' : this.stress > 0.3 ? 'linear-gradient(90deg,#7c3aed,#f97316)' : 'linear-gradient(90deg,#7c3aed,#a855f7)';
            const msg = document.getElementById('clash-msg');
            if (msg) msg.textContent = this.stress < 0.1 ? '¡MOVETE!' : this.stress < 0.4 ? '¡MÁS FUERTE!' : this.stress < 0.7 ? '¡ESO!' : '¡PODER MÁXIMO!';
        };

        this.resizeFn = () => {
            if (!this.active) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', this.resizeFn);
        
        if (this.active) {
            this.animateFn();
        }
    }

    start() {
        if (this.active) return;
        this.active = true;
        this.sceneContainer.classList.add('visible');
        this.stress = 0;
        this.targetStress = 0;
        if (this.resizeFn) this.resizeFn();
        if (this.animateFn) this.animateFn();
    }

    stop() {
        this.active = false;
        this.sceneContainer.classList.remove('visible');
        if (this.animFrame) cancelAnimationFrame(this.animFrame);
    }

    setStress(val) {
        this.targetStress = Math.min(1, val / 6);
    }
    
    updateTimeBar(progress) {
        const fill = document.getElementById('bar-fill');
        if (fill) fill.style.width = Math.max(0, (100 - progress * 100)) + '%';
    }
}

// ----------------------------------------------------------------
// AUDIO ENGINE (copiado del legacy)
// ----------------------------------------------------------------
let audioCtx = null;
let sounds = {};

// ----------------------------------------------------------------
// PRE-FETCH: descargamos los archivos de audio como ArrayBuffers
// crudos al cargar la página. NO llamamos a decodeAudioData() acá
// porque en iOS Safari, decodificar con un AudioContext suspendido
// devuelve buffers de CEROS (silencio total, sin error).
// ----------------------------------------------------------------
const _rawAudio = {};

async function _prefetchSound(name, url) {
    try {
        const response = await fetch(url);
        _rawAudio[name] = await response.arrayBuffer();
    } catch (e) { console.warn(`Sound ${name} prefetch failed:`, e); }
}

// Descargar inmediatamente (solo red, no necesita AudioContext)
_prefetchSound('expelliarmus', 'sounds/expelliarmus.wav');
_prefetchSound('desmaius',     'sounds/desmaius.wav');
_prefetchSound('protego',      'sounds/protego.wav');

// ----------------------------------------------------------------
// AUDIO UNLOCK + DECODE
// iOS Safari exige que resume() se llame dentro de un gesto de
// usuario. devicemotion NO cuenta como gesto.
//
// Flujo:
// 1. Usuario toca la pantalla (lobby, botón, lo que sea)
// 2. resume() arranca y resuelve → contexto en 'running'
// 3. AHORA decodificamos los ArrayBuffers pre-descargados
// 4. playSound() espera esta Promise si los sonidos no están listos
// ----------------------------------------------------------------
let _audioReady = false;
let _audioReadyPromise = null;

function _unlockAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    // Si ya está corriendo y ya se decodificó todo, no hacemos nada
    if (audioCtx.state === 'running' && _audioReady) return;

    // Llamamos a resume() SIEMPRE que no esté running, para sacarlo
    // del estado 'interrupted' que provocan los carteles nativos de iOS.
    const resumeP = audioCtx.resume();

    if (!_audioReady && !_audioReadyPromise) {
        _audioReadyPromise = resumeP.then(async () => {
            // Buffer silencioso: trick estándar para "despertar" iOS Safari
            try {
                const silentBuf = audioCtx.createBuffer(1, 1, 22050);
                const silentSrc = audioCtx.createBufferSource();
                silentSrc.buffer = silentBuf;
                silentSrc.connect(audioCtx.destination);
                silentSrc.start(0);
            } catch(e) {}

            // Decodificar los sonidos AHORA que el contexto está 'running'.
            const entries = Object.entries(_rawAudio);
            await Promise.all(entries.map(async ([name, buf]) => {
                try {
                    sounds[name] = await audioCtx.decodeAudioData(buf.slice(0));
                } catch(e) { console.warn(`Sound ${name} decode failed:`, e); }
            }));

            _audioReady = true;
            console.log('🔊 Audio listo. Estado:', audioCtx.state, '| Sonidos:', Object.keys(sounds).join(', '));
        }).catch(e => {
            _audioReadyPromise = null; // Permitir reintento en el próximo gesto
            console.warn('⚠️ Error al inicializar audio:', e);
        });
    }
}

// Fase de captura para atrapar el gesto ANTES de que lo consuma
// cualquier otro handler (botones, stopPropagation, etc.)
['touchstart', 'touchend', 'click'].forEach(evt =>
    document.addEventListener(evt, _unlockAudio, { capture: true, passive: true })
);

async function playSound(tipo, isMine) {
    // Esperar a que el audio esté completamente listo (unlock + decode).
    // Esto cubre el caso donde el primer hechizo se dispara por devicemotion
    // antes de que los sonidos terminen de decodificarse.
    if (!_audioReady) {
        if (_audioReadyPromise) {
            await _audioReadyPromise;
        } else {
            console.warn('⚠️ Audio no inicializado. Tocá la pantalla primero.');
            return null;
        }
    }

    if (!sounds[tipo]) {
        console.warn(`⚠️ Sonido '${tipo}' no disponible.`);
        return null;
    }

    const source = audioCtx.createBufferSource();
    source.buffer = sounds[tipo];

    const filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'lowpass';
    filterNode.frequency.value = 20000; // Sin filtro por defecto

    const gainNode = audioCtx.createGain();

    if (tipo === 'protego') {
        gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
    } else {
        const travelDuration = 0.8;
        const curveLength = 100;
        const curve = new Float32Array(curveLength);
        for (let i = 0; i < curveLength; i++) {
            const x = i / (curveLength - 1);
            const sigmoid = 1 / (1 + Math.exp(-12 * (x - 0.5)));
            // Si es mío, el sonido se ALEJA (baja volumen). Si es del rival, el sonido SE ACERCA (sube volumen).
            curve[i] = isMine ? (1 - Math.max(0, sigmoid)) : Math.max(0, sigmoid);
        }
        curve[0] = isMine ? 1 : 0;
        curve[curveLength - 1] = isMine ? 0 : 1;
        gainNode.gain.setValueCurveAtTime(curve, audioCtx.currentTime, travelDuration);
    }

    source.connect(filterNode);
    filterNode.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    // Aumentar velocidad para Expelliarmus
    if (tipo === 'expelliarmus') {
        source.playbackRate.value = 1.4;
    }

    // Mantenemos la limpieza para que no se corte el audio tras varios hechizos
    source.onended = () => {
        source.disconnect();
        filterNode.disconnect();
        gainNode.disconnect();
    };

    const offset = (tipo === 'protego') ? 0.25 : 0;
    source.start(audioCtx.currentTime, offset);

    return { source, gainNode, filterNode };
}

function applyDamage(tipo) {
    let damage = 10;
    if (tipo === 'desmaius') damage = 25;
    if (tipo === 'accio')    damage = 5;

    health = Math.max(0, health - damage);
    if (myHealthBar) myHealthBar.setHealth(health / 100);
    if (window.navigator.vibrate) window.navigator.vibrate(100);

    if (currentRoomId) socket.emit('game-event', { roomId: currentRoomId, event: 'health-update', jugador: playerNum, health: health });

    if (health <= 0) {
        showEndScreen('defeat');
        sendP2P({ type: 'game-over', winner: (playerNum === 1 ? 2 : 1) });
        if (currentRoomId) socket.emit('game-event', { roomId: currentRoomId, event: 'game-over', winner: (playerNum === 1 ? 2 : 1) });
    }
}

function receiveAttack(data) {
    console.log("⚡ Hechizo recibido del rival:", data.tipo);
    // data = { tipo, jugador }
    const isMe = data.jugador === playerNum;
    if (isMe) return; // no procesamos nuestros propios hechizos
    if (data.tipo === 'protego') return;

    // ¿Choque? Solo el Host decide (para evitar doble procesamiento)
    if (isHost && pendingMySpell && !isInClash && !hasClashedThisDuel && offensiveSpells.includes(pendingMySpell.tipo)) {
        const elapsed = Date.now() - pendingMySpell.timestamp;
        if (elapsed < CLASH_WINDOW_MS) {
            console.log(`⚡ CHOQUE detectado! (${elapsed}ms) ${pendingMySpell.tipo} vs ${data.tipo}`);
            pendingMySpell = null;
            // Arrancar choque en ambos lados
            startClash();
            sendP2P({ type: 'clash-start' });
            if (currentRoomId) socket.emit('game-event', { roomId: currentRoomId, event: 'clash-start' });
            return;
        }
    }

    const soundNodes = playSound(data.tipo, false);
    const impactDelay = (data.tipo === 'expelliarmus') ? 600 : 800;

    setTimeout(() => {
        if (isProtected) { 
            setSpellStatus('¡Protegido!'); 
            if (soundNodes) {
                const now = audioCtx.currentTime;
                // Efecto de disipación: asfixiar frecuencias y bajar volumen rápido
                soundNodes.filterNode.frequency.setValueAtTime(20000, now);
                soundNodes.filterNode.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                
                soundNodes.gainNode.gain.cancelScheduledValues(now);
                soundNodes.gainNode.gain.setValueAtTime(soundNodes.gainNode.gain.value || 1, now);
                soundNodes.gainNode.gain.linearRampToValueAtTime(0.01, now + 0.15);
                
                setTimeout(() => { try { soundNodes.source.stop(); } catch(e){} }, 200);
            }
            return; 
        }
        applyDamage(data.tipo);
        if (data.tipo === 'expelliarmus') {
            isDisarmed = true;
            setSpellStatus('¡DESARMADO!');
            setTimeout(() => { isDisarmed = false; setSpellStatus(''); }, 3000);
        }
    }, impactDelay);
}

function triggerSpell(tipo, event) {
    if (isDisarmed || spellCooldown || isInClash) return;
    if (event) event.stopPropagation();

    spellCooldown = true;
    setTimeout(() => spellCooldown = false, 1500);

    const msg = { type: 'spell', tipo, jugador: playerNum };

    // Guardar nuestro hechizo para detección de choque
    pendingMySpell = { tipo, timestamp: Date.now() };
    setTimeout(() => { pendingMySpell = null; }, CLASH_WINDOW_MS);

    // Feedback local inmediato
    showVisualFeedback(tipo);
    playSound(tipo, true);

    if (tipo === 'protego') {
        isProtected = true;
        setTimeout(() => isProtected = false, 1500);
    }

    // Enviar al rival por DataChannel
    sendP2P(msg);

    // Relay a la pantalla/proyector via Socket.io
    if (currentRoomId) {
        socket.emit('game-event', { roomId: currentRoomId, event: 'spell', tipo, jugador: playerNum });
    }
}

// CLASH MECHANIC (copiado del legacy)

let clashStartTime = 0;
const CLASH_DURATION_MS = 8000;

function startClash() {
    if (isInClash || hasClashedThisDuel) return;
    
    isInClash = true;
    hasClashedThisDuel = true;
    spellCooldown = true;
    setSpellStatus(''); // Ocultar el texto base
    showClashGlow();

    myMotionBuffer = [];
    rivalMotionBuffer = [];

    clashStartTime = Date.now();
    if (!myClashLightning) myClashLightning = new ClashLightning();
    myClashLightning.start();

    // Solo el Host maneja el temporizador del choque
    if (isHost) {
        setTimeout(() => {
            // Sumar la inestabilidad de las últimas muestras
            const myTotal = myMotionBuffer.reduce((a, b) => a + b, 0);
            const rivalTotal = rivalMotionBuffer.reduce((a, b) => a + b, 0);
            
            // El que más se mueve (mayor inestabilidad) gana
            let loser;
            if (myTotal > rivalTotal) {
                loser = 2; // Cliente pierde (Host gana)
            } else if (rivalTotal > myTotal) {
                loser = 1; // Host pierde (Cliente gana)
            } else {
                loser = Math.random() > 0.5 ? 1 : 2; // Empate -> azar
            }

            const endMsg = { type: 'clash-end', loser, damage: 30 };
            
            // Avisar al cliente
            sendP2P(endMsg);
            // Avisar a la pantalla
            socket.emit('game-event', { roomId: currentRoomId, event: 'clash-end', loser, damage: 30 });
            // Procesar localmente
            endClash(endMsg);
        }, CLASH_DURATION_MS);
    }

    // FIX #3: Limpiar el interval anterior antes de crear uno nuevo.
    // Si startClash() se llama dos veces (host + relay del cliente),
    // sin esto quedan dos intervals corriendo indefinidamente.
    if (motionDebugInterval) { clearInterval(motionDebugInterval); motionDebugInterval = null; }

    motionDebugInterval = setInterval(() => {
        if (isInClash) {
            if (myClashLightning) {
                myClashLightning.setStress(lastMotionValue);
                const progress = Math.min(1, (Date.now() - clashStartTime) / CLASH_DURATION_MS);
                myClashLightning.updateTimeBar(progress); 
            }
        }
    }, 100);
}

function endClash(data) {
    isInClash = false;
    spellCooldown = false;
    stopClashMotion();
    document.getElementById('combat').classList.remove('is-illuminated');

    if (myClashLightning) myClashLightning.stop();

    if (data.loser === playerNum) {
        applyDamage('desmaius');
        setSpellStatus(`¡PERDISTE EL CHOQUE! -${data.damage}`);
        if (window.navigator.vibrate) window.navigator.vibrate([300, 100, 300]);
    } else {
        setSpellStatus('✨ ¡GANASTE EL CHOQUE!');
    }
    setTimeout(() => setSpellStatus(''), 2500);
}

let gestureBuffer = [];
let analyzingGesture = false;

function checkGesture(e) {
    if (isDisarmed || spellCooldown || isInClash) return;

    const acc = e.acceleration;
    if (!acc || acc.x === null) return;

    // Acumulamos siempre el movimiento en el buffer (los últimos 30 frames)
    gestureBuffer.push({ x: acc.x, y: acc.y, z: acc.z });
    if (gestureBuffer.length > 30) gestureBuffer.shift();

    if (analyzingGesture) return; // Si ya cruzó el umbral, solo acumula frames hasta que pasen los 150ms

    const magnitude = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);

    if (magnitude > FLICK_THRESHOLD && (Date.now() - lastFlickTime > 1200)) {
        analyzingGesture = true;
        
        // Esperamos 150ms extra para capturar el gesto completo
        setTimeout(() => {
            let maxX = -Infinity, minX = Infinity, maxY = -Infinity;
            let firstSignificantX = 0; // Guardará el primer movimiento fuerte en X

            for (let frame of gestureBuffer) {
                if (frame.x > maxX) maxX = frame.x;
                if (frame.x < minX) minX = frame.x;
                if (frame.y > maxY) maxY = frame.y;
                
                // Buscamos el primer instante donde la fuerza en X supere los 15G (positivo o negativo)
                if (firstSignificantX === 0 && Math.abs(frame.x) > 15) {
                    firstSignificantX = frame.x;
                }
            }

            let tipo = '';
            
            // --- CEREBRO DEL DETECTOR v3 (Secuencia Temporal) ---
            // Los logs revelaron el secreto: la intensidad de ambos movimientos es altísima, pero el ORDEN es distinto.
            // ATAQUE (Atrás a adelante): El brazo gira hacia afuera primero. El primer pico fuerte de X es POSITIVO.
            // DEFENSA (Derecha a izquierda): El brazo cruza hacia adentro primero. El primer pico fuerte de X es NEGATIVO.
            // Si hacemos un Protego súper fuerte, el brazo rebota y genera un X positivo gigante, pero ocurre DESPUÉS del negativo.
            // NUEVO FILTRO: Si el sensor se "durmió" y solo grabó la mitad del rebote (falso ataque), lo detectamos
            // porque todo Ataque real siempre tiene un latigazo final negativo (minX < -20). Si falta, es Protego.
            
            if ((firstSignificantX > 0 || (firstSignificantX === 0 && maxY > 40)) && minX < -20) {
                // El primer movimiento fuerte fue hacia afuera y hubo latigazo final -> ATAQUE
                let newSpell;
                do {
                    newSpell = offensiveSpells[Math.floor(Math.random() * offensiveSpells.length)];
                } while (newSpell === lastOffensiveSpell && offensiveSpells.length > 1);
                
                tipo = newSpell;
                lastOffensiveSpell = newSpell;
            } else {
                // El primer movimiento fuerte fue hacia adentro (Protego)
                tipo = 'protego';
            }

            console.log(`¡Gesto analizado! Primer X fuerte: ${firstSignificantX.toFixed(1)} -> Lanzando: ${tipo}`);
            
            // Enviar log a la pantalla para debug
            socket.emit('game-event', {
                roomId: currentRoomId,
                event: 'leviosa-record',
                data: gestureBuffer.map(d => ({
                    x: parseFloat(d.x.toFixed(2)),
                    y: parseFloat(d.y.toFixed(2)),
                    z: parseFloat(d.z.toFixed(2)),
                    label: `J${playerNum}: ${tipo.toUpperCase()}`
                }))
            });

            triggerSpell(tipo);
            if (window.navigator.vibrate) window.navigator.vibrate([70, 30, 100]);
            
            lastFlickTime = Date.now();
            analyzingGesture = false;
            gestureBuffer = []; // Limpiamos para el próximo hechizo
        }, 150);
    }
}

function reportIncorrectSpell() {
    if (window.navigator.vibrate) window.navigator.vibrate(200);
    socket.emit('game-event', {
        roomId: currentRoomId,
        event: 'leviosa-incorrect',
        jugador: playerNum
    });
    
    const btn = document.querySelector('.btn-incorrect');
    btn.textContent = "✅ ENVIADO";
    setTimeout(() => { btn.textContent = "⚠️ Marcar error"; }, 1000);
}

function initGlobalMotion() {

    if (motionHandler) return;
    motionHandler = (e) => {
        if (isInClash) {
            const rawAcc = e.acceleration;
            const acc = (rawAcc && rawAcc.x !== null) ? rawAcc : e.accelerationIncludingGravity;
            if (!acc) return;
            const valor = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
            lastMotionValue = valor;
            
            // Si soy el Host, acumulo mi propio movimiento
            if (isHost) {
                myMotionBuffer.push(valor);
                if (myMotionBuffer.length > 20) myMotionBuffer.shift();
            }

            if (valor > 0.5) {
                sendP2P({ type: 'motion', jugador: playerNum, valor });
                if (currentRoomId) socket.emit('game-event', { roomId: currentRoomId, event: 'motion', jugador: playerNum, valor });
                if (valor > 5 && window.navigator.vibrate) window.navigator.vibrate(30);
            }
        } else {
            checkGesture(e);
        }
    };
    window.addEventListener('devicemotion', motionHandler);
}

function stopClashMotion() {
    if (motionDebugInterval) { clearInterval(motionDebugInterval); motionDebugInterval = null; }
}

// ----------------------------------------------------------------
// MANEJO DE MENSAJES P2P ENTRANTES
// ----------------------------------------------------------------
function handleP2PMessage(msg) {
    switch (msg.type) {
        case 'spell':
            receiveAttack(msg);
            break;
        case 'motion':
            // Solo el host arbitra el choque
            if (isHost) handleMotionFromRival(msg.valor);
            break;
        case 'clash-start':
            startClash();
            if (currentRoomId) socket.emit('game-event', { roomId: currentRoomId, event: 'clash-start' });
            break;
        case 'clash-end':
            endClash(msg);
            if (currentRoomId) socket.emit('game-event', { roomId: currentRoomId, event: 'clash-end', loser: msg.loser, damage: msg.damage });
            break;
        case 'health-sync':
            // El host envía al cliente su vida actualizada
            if (!isHost) {
                health = msg.health;
                if (myHealthBar) myHealthBar.setHealth(health / 100);
            }
            break;
        case 'game-over':
            if (msg.winner === playerNum) {
                showEndScreen('victory');
            } else {
                showEndScreen('defeat');
            }
            break;
        case 'rematch':
            resetGame();
            break;
    }
}

// Lógica de árbitro de choque (solo corre en el Host)
let rivalMotionBuffer = [];
let myMotionBuffer = [];

function handleMotionFromRival(valor) {
    rivalMotionBuffer.push(valor);
    if (rivalMotionBuffer.length > 20) rivalMotionBuffer.shift();
}

// ----------------------------------------------------------------
// WEBRTC
// ----------------------------------------------------------------
let peerConnection;
let dataChannel;
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function createPeerConnection() {
    peerConnection = new RTCPeerConnection(rtcConfig);

    peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
            socket.emit('signal', { roomId: currentRoomId, signalData: { candidate: event.candidate } });
        }
    };

    peerConnection.onconnectionstatechange = () => {
        console.log('P2P State:', peerConnection.connectionState);
        if (peerConnection.connectionState === 'connected') enterCombat();
        if (peerConnection.connectionState === 'disconnected') setSpellStatus('Rival desconectado');
    };
}

function setupDataChannel(channel) {
    dataChannel = channel;
    dataChannel.onopen    = () => console.log('DataChannel abierto!');
    dataChannel.onmessage = (event) => handleP2PMessage(JSON.parse(event.data));
}

function sendP2P(obj) {
    if (dataChannel && dataChannel.readyState === 'open') {
        dataChannel.send(JSON.stringify(obj));
    }
}

// HOST: espera que se una alguien y lanza la oferta
socket.on('user-joined', async () => {
    if (!isHost && !document.getElementById('mago1-view').classList.contains('hidden')) {
        // En caso manual, asumimos el rol acá
        isHost = true;
        playerNum = 1;
        createPeerConnection();
    }
    if (!isHost) return; // Cliente ignorar
    
    console.log('Rival detectado → iniciando WebRTC como HOST');
    
    if (!dataChannel || dataChannel.readyState === 'closed') {
        dataChannel = peerConnection.createDataChannel('magic-duel');
        setupDataChannel(dataChannel);
    }

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('signal', { roomId: currentRoomId, signalData: { offer } });
    setLobbyStatus('Rival encontrado, conectando...');
});

// CLIENTE: recibe y responde señales
socket.on('signal', async (data) => {
    const { signalData } = data;
    if (!peerConnection) {
        isHost = false;
        playerNum = 2;
        createPeerConnection();
        peerConnection.ondatachannel = (event) => setupDataChannel(event.channel);
    }

    if (signalData.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(signalData.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { roomId: currentRoomId, signalData: { answer } });
    } else if (signalData.answer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(signalData.answer));
    } else if (signalData.candidate) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(signalData.candidate));
    }
});

// ----------------------------------------------------------------
// TRANSICIÓN LOBBY → COMBATE
// ----------------------------------------------------------------
function enterCombat() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('combat').style.display = 'block';
    document.getElementById('connection-status').textContent = `Mago ${playerNum} | P2P ✓`;
    
    if (!myHealthBar) {
        myHealthBar = new LiquidBar('liq-hp');
        myHealthBar.start();
    }
    
    initGlobalMotion();
}

async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
                console.log('Wake Lock soltado');
            });
            console.log('Wake Lock activado (Sensor al 100%)');
        }
    } catch (err) {
        console.warn(`Wake Lock falló: ${err.name}, ${err.message}`);
    }
}

document.addEventListener('visibilitychange', () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
    }
});

function handleBodyTap() {
    _unlockAudio(); // Refuerzo por si el capture-phase listener no alcanzó
    requestWakeLock(); // Activamos el Wake Lock para que el sensor no se duerma
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(state => {
            if (state === 'granted') initGlobalMotion();
        });
    } else {
        initGlobalMotion();
    }
}

// Soporte para teclado (PC Testing)
window.addEventListener('keydown', (e) => {
    if (isDisarmed || spellCooldown || isInClash) return;
    
    if (e.key === 'ArrowRight') {
        // Ataque
        let newSpell;
        do {
            newSpell = offensiveSpells[Math.floor(Math.random() * offensiveSpells.length)];
        } while (newSpell === lastOffensiveSpell && offensiveSpells.length > 1);
        
        lastOffensiveSpell = newSpell;
        triggerSpell(newSpell);
    } 
    else if (e.key === 'ArrowLeft') {
        // Defensa
        triggerSpell('protego');
    }
});

// ----------------------------------------------------------------
// LOBBY UI
// ----------------------------------------------------------------
const mainView  = document.getElementById('main-view');
const mago1View = document.getElementById('mago1-view');
const mago2View = document.getElementById('mago2-view');
let html5QrCode;

function setLobbyStatus(text) {
    const el = document.getElementById('lobby-status');
    if (el) el.textContent = text;
}

document.getElementById('btnCreate').onclick = () => {
    currentRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
    mainView.classList.add('hidden');
    mago1View.classList.remove('hidden');
    document.getElementById('room-id-display').textContent = `SALA: ${currentRoomId}`;

    socket.emit('join-room', currentRoomId);
    setLobbyStatus('Conectado. Esperando rival...');

    document.getElementById('qr-canvas').innerHTML = '';
    new QRCode(document.getElementById('qr-canvas'), {
        text: `${window.location.origin}/?room=${currentRoomId}`,
        width: 256,
        height: 256,
        colorDark: '#000000',
        colorLight: '#FFFFFF'
    });
};

document.getElementById('btnJoin').onclick = () => {
    mainView.classList.add('hidden');
    mago2View.classList.remove('hidden');

    html5QrCode = new Html5Qrcode('reader');
    html5QrCode.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decoded) => {
        stopScanner();
        joinRoom(decoded.includes('?room=') ? new URL(decoded).searchParams.get('room') : decoded);
    });
};

function stopScanner() {
    if (html5QrCode) html5QrCode.stop().catch(() => {});
}

function joinRoom(roomId) {
    currentRoomId = roomId;
    playerNum = 2;
    socket.emit('join-room', roomId);
    mago2View.innerHTML = `
        <h2 class="text-2xl font-bold text-green-400">¡SALA ENCONTRADA!</h2>
        <p class="text-slate-400 mt-4 animate-pulse">Estableciendo conexión P2P...</p>
        <p class="font-mono text-purple-300 mt-2">SALA: ${roomId}</p>
    `;
}

// (sin listeners de game-event en el celu - la lógica vive en el P2P)

// Auto-unirse si viene de un QR
const roomFromUrl = new URLSearchParams(window.location.search).get('room');
const setupRoomFromUrl = new URLSearchParams(window.location.search).get('setup_room');

if (roomFromUrl) {
    joinRoom(roomFromUrl);
} else if (setupRoomFromUrl) {
    // Si viene del QR de la pantalla, preguntamos al servidor qué rol nos toca
    socket.emit('join-setup', setupRoomFromUrl);
}

socket.on('setup-role', (data) => {
    if (data.role === 'host') {
        currentRoomId = data.room;
        isHost = true;
        playerNum = 1;
        createPeerConnection();
        dataChannel = peerConnection.createDataChannel('magic-duel');
        setupDataChannel(dataChannel);
        
        mainView.classList.add('hidden');
        mago1View.classList.remove('hidden');
        document.getElementById('room-id-display').textContent = `SALA: ${currentRoomId}`;
        setLobbyStatus('Mago 1 asignado. Esperando al Mago 2...');
        document.getElementById('qr-canvas').innerHTML = ''; // Ocultar QR si estamos en setup por pantalla
    } else if (data.role === 'client') {
        currentRoomId = data.room;
        isHost = false;
        playerNum = 2;
        mainView.classList.add('hidden');
        mago2View.classList.remove('hidden');
        mago2View.innerHTML = `
            <h2 class="text-2xl font-bold text-green-400">¡SALA ENCONTRADA!</h2>
            <p class="text-slate-400 mt-4 animate-pulse">Mago 2 asignado. Conectando P2P...</p>
            <p class="font-mono text-purple-300 mt-2">SALA: ${data.room}</p>
        `;
    } else if (data.role === 'full') {
        alert("La sala está llena.");
    }
});

// ----------------------------------------------------------------
// END SCREEN ENGINE (Three.js)
// ----------------------------------------------------------------
let endScene, endCamera, endRenderer, endParticleSystem;
const particleCount = 5000;
let endState = 'victory';

const endThemes = {
    victory: { color: 0xffd700, bg: 0x0a0a00, speed: 0.02,  direction: 1,  textColor: '#ffd700', text: 'VICTORIA' },
    defeat:  { color: 0x6a0dad, bg: 0x050005, speed: 0.015, direction: -1, textColor: '#9d4edd', text: 'DERROTA' }
};

function showEndScreen(state) {
    endState = state;
    document.getElementById('combat').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    
    const theme = endThemes[state];
    const textEl = document.getElementById('end-status-text');
    textEl.innerText = theme.text;
    textEl.style.color = theme.textColor;

    initEndScene(theme);
}

function resetGame() {
    // 1. Reiniciar variables de estado
    health = 100;
    isProtected = false;
    isDisarmed = false;
    spellCooldown = false;
    isInClash = false;
    pendingMySpell = null;
    hasClashedThisDuel = false;

    // 2. Reiniciar UI
    if (myHealthBar) myHealthBar.setHealth(1.0);
    document.getElementById('spell-label').textContent = '';
    document.getElementById('spell-status').className = '';
    document.getElementById('combat').classList.remove('is-illuminated');

    // 3. Ocultar pantalla final y volver al combate
    document.getElementById('end-screen').style.display = 'none';
    document.getElementById('combat').style.display = 'block';

    if (currentRoomId) socket.emit('game-event', { roomId: currentRoomId, event: 'health-update', jugador: playerNum, health: 100 });

    // 4. Limpiar Three.js de fin de juego
    if (endRenderer) {
        endRenderer.dispose();
        const canvas = document.querySelector('#end-screen canvas');
        if (canvas) canvas.remove();
    }
}

function requestRematch() {
    // Avisar al rival por P2P
    sendP2P({ type: 'rematch' });

    // Avisar a la pantalla por Socket
    if (currentRoomId) {
        socket.emit('game-event', { roomId: currentRoomId, event: 'rematch' });
    }

    // Reiniciar localmente
    resetGame();
}

function initEndScene(theme) {
    endScene = new THREE.Scene();
    endScene.background = new THREE.Color(theme.bg);

    endCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    endCamera.position.z = 5;

    endRenderer = new THREE.WebGLRenderer({ antialias: true });
    endRenderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('end-screen').appendChild(endRenderer.domElement);

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 10;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const material = new THREE.PointsMaterial({
        size: 0.05,
        color: theme.color,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
    });

    endParticleSystem = new THREE.Points(geometry, material);
    endScene.add(endParticleSystem);

    animateEndScene();
}

function animateEndScene() {
    if (document.getElementById('end-screen').style.display === 'none') return;
    requestAnimationFrame(animateEndScene);

    const positions = endParticleSystem.geometry.attributes.position.array;
    const theme = endThemes[endState];

    for (let i = 0; i < particleCount; i++) {
        positions[i * 3 + 1] += theme.speed * theme.direction;
        const x = positions[i * 3];
        const z = positions[i * 3 + 2];
        positions[i * 3] = x * Math.cos(0.002) - z * Math.sin(0.002);
        positions[i * 3 + 2] = x * Math.sin(0.002) + z * Math.cos(0.002);

        if (theme.direction === 1 && positions[i * 3 + 1] > 5) positions[i * 3 + 1] = -5;
        else if (theme.direction === -1 && positions[i * 3 + 1] < -5) positions[i * 3 + 1] = 5;
    }

    endParticleSystem.geometry.attributes.position.needsUpdate = true;
    endParticleSystem.rotation.y += 0.001;
    endRenderer.render(endScene, endCamera);
}

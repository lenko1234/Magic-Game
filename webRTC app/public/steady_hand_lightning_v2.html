
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#scene {
  display: flex; flex-direction: column; align-items: center;
  padding: 2rem 1.5rem; gap: 0; min-height: 320px;
  background: #06040f;
}
canvas#bolt { display: block; width: 100%; max-width: 520px; pointer-events: none; }
#orb-row {
  display: flex; align-items: center; justify-content: center;
  width: 100%; max-width: 520px; gap: 0; position: relative; height: 70px;
}
#orb {
  width: 52px; height: 52px; border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #c084fc, #7c3aed 55%, #3b0764);
  border: 1.5px solid #a855f7;
  position: relative; z-index: 2; flex-shrink: 0;
  transition: box-shadow 0.2s;
}
#bar-wrap {
  flex: 1; height: 14px; background: #0f0a1a; border-radius: 0 7px 7px 0;
  border: 1px solid #1e1035; overflow: hidden; position: relative;
}
#bar-fill {
  height: 100%; border-radius: 0 7px 7px 0;
  background: linear-gradient(90deg, #7c3aed, #a855f7);
  transition: width 0.15s;
}
#msg {
  font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
  color: #6b21a8; margin-top: 10px; height: 16px; font-weight: 500;
}
#test-btn {
  margin-top: 18px; font-size: 12px; padding: 6px 18px; border-radius: 4px;
  cursor: pointer; border: 1px solid #4a1d96; background: transparent;
  color: #7c3aed; letter-spacing: 0.06em; text-transform: uppercase;
}
#test-btn:hover { background: #0f0a1a; }
</style>

<div id="scene">
  <canvas id="bolt" height="200"></canvas>
  <div id="orb-row">
    <div id="orb"></div>
    <div id="bar-wrap"><div id="bar-fill" style="width:0%"></div></div>
  </div>
  <div id="msg">quieto...</div>
  <button id="test-btn" onclick="window.addStress(0.4)">simular movimiento</button>
</div>

<script>
const canvas = document.getElementById('bolt');
const ctx = canvas.getContext('2d');
const scene = document.getElementById('scene');
let W, H;

function resize() {
  W = Math.min(scene.clientWidth - 48, 520);
  canvas.width = W; canvas.height = 200; H = 200;
}
resize();

let stress = 0, targetStress = 0, t = 0;
let bolts = [], sparks = [];

function boltSegs(x1,y1,x2,y2,rough,depth) {
  if (depth > 6) return [{x1,y1,x2,y2}];
  const mx=(x1+x2)/2+(Math.random()-0.5)*rough;
  const my=(y1+y2)/2+(Math.random()-0.5)*rough;
  return [...boltSegs(x1,y1,mx,my,rough*0.6,depth+1),...boltSegs(mx,my,x2,y2,rough*0.6,depth+1)];
}

function generateBolt() {
  const cx=W/2, spread=80+stress*120, rough=8+stress*40;
  const sx=cx+(Math.random()-0.5)*spread*0.3, ex=cx+(Math.random()-0.5)*spread;
  const color = stress>0.6?`rgba(255,${Math.floor(80-stress*60)},${Math.floor(80-stress*60)},`
    : stress>0.3?`rgba(220,${Math.floor(160-stress*100)},255,`:`rgba(180,130,255,`;
  return { segs:boltSegs(sx,0,ex,H*0.75,rough,0), life:1.0, decay:0.08+Math.random()*0.1, alpha:0.5+stress*0.5, width:0.5+stress*1.8, color };
}

function addSparks(n) {
  const cx=W/2+(Math.random()-0.5)*60*stress, cy=H*(0.6+Math.random()*0.15);
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, sp=(1+Math.random()*3)*(0.5+stress*1.5);
    sparks.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,r:1+Math.random()*1.5,color:stress>0.5?'#f87171':'#c084fc'});
  }
}

function draw() {
  t++;
  stress += (targetStress - stress) * 0.06;
  if (Math.abs(targetStress-stress)<0.001) stress=targetStress;
  targetStress *= 0.97;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#06040f'; ctx.fillRect(0,0,W,H);

  const freq = stress>0.05 ? Math.max(1,Math.floor(8-stress*6)) : 30;
  if (t%freq===0) {
    bolts.push(generateBolt());
    if (stress>0.3) addSparks(Math.floor(3+stress*6));
  }

  for (const b of bolts) {
    ctx.lineWidth=b.width*b.life;
    for (const s of b.segs) {
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2);
      ctx.strokeStyle=b.color+(b.alpha*b.life)+')'; ctx.stroke();
    }
    if (stress>0.15) {
      ctx.lineWidth=b.width*b.life*3;
      for (const s of b.segs) {
        ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2);
        ctx.strokeStyle=b.color+(b.alpha*b.life*0.15)+')'; ctx.stroke();
      }
    }
    b.life-=b.decay;
  }
  bolts=bolts.filter(b=>b.life>0);

  for (const s of sparks) {
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.12; s.life-=0.05;
    ctx.beginPath(); ctx.arc(s.x,s.y,Math.max(0.1,s.r*s.life),0,Math.PI*2);
    ctx.fillStyle=s.color; ctx.globalAlpha=s.life; ctx.fill(); ctx.globalAlpha=1;
  }
  sparks=sparks.filter(s=>s.life>0);

  const glowSize=8+stress*30;
  const glowCol=stress>0.6?`rgba(239,68,68,${0.15+stress*0.3})`:`rgba(168,85,247,${0.1+stress*0.25})`;
  document.getElementById('orb').style.boxShadow=`0 0 ${glowSize}px ${glowSize/2}px ${glowCol}`;

  const pct=Math.min(100,stress*100);
  const fill=document.getElementById('bar-fill');
  fill.style.width=pct+'%';
  fill.style.background=stress>0.6?'linear-gradient(90deg,#7f1d1d,#ef4444)':stress>0.3?'linear-gradient(90deg,#7c3aed,#f97316)':'linear-gradient(90deg,#7c3aed,#a855f7)';

  const msg=document.getElementById('msg');
  msg.textContent=stress<0.05?'quieto...':stress<0.3?'cuidado...':stress<0.6?'¡temblando!':'¡fuera de control!';

  requestAnimationFrame(draw);
}
draw();

window.addStress = function(amount) { targetStress=Math.min(1,targetStress+amount); };
window.addEventListener('resize', resize);
</script>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forcefield V2 - Fenómeno Imposible</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>

<body>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';

        const NOISE_GLSL = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }
        `;

        const DISTORTION_SHADER = {
            uniforms: { "tDiffuse": { value: null }, "uTime": { value: 0 }, "uIntensity": { value: 0.012 } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `${NOISE_GLSL}
                uniform sampler2D tDiffuse; uniform float uTime; uniform float uIntensity; varying vec2 vUv;
                void main() {
                    vec2 uv = vUv;
                    float n = snoise(vec3(uv * 1.5, uTime * 0.1));
                    float mask = smoothstep(0.8, 0.2, length(uv - 0.5));
                    uv += n * uIntensity * mask;
                    gl_FragColor = texture2D(tDiffuse, uv);
                }
            `
        };

        // --- PLASMA UNIFICADO (Vapor Volumétrico) ---
        const PLASMA_VS = `
            ${NOISE_GLSL}
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            uniform float uTime;
            uniform float uVary;

            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPos = worldPos.xyz;
                
                vec3 pos = position;
                // Deformación COHERENTE basada en posición global (une las capas)
                float d = snoise(vWorldPos * 0.4 + uTime * 0.3) * 1.5;
                float d2 = snoise(vWorldPos * 1.5 - uTime * 0.6) * 0.4;
                
                pos += normal * (d + d2) * uVary;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const PLASMA_FS = `
            ${NOISE_GLSL}
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            uniform float uTime;
            uniform float uAlphaMult;
            uniform float uGlobalAlpha;

            void main() {
                // --- CAMPO DE VAPOR UNIFICADO ---
                float v1 = snoise(vWorldPos * 0.5 + uTime * 0.2);
                float v2 = snoise(vWorldPos * 1.2 - uTime * 0.4);
                float vapor = smoothstep(-0.8, 1.0, v1 * v2);
                
                // Distancia al centro del tubo
                float tubeDist = abs(vUv.y - 0.5) * 2.0;
                
                float softEdge = pow(1.0 - tubeDist, 1.2);
                
                // Núcleo MUCHO más fino (bajamos de 0.12 a 0.04)
                float core = smoothstep(0.04, 0.0, tubeDist);
                float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0,0,1))), 3.0);
                
                vec3 c1 = vec3(0.0, 0.05, 0.2);
                vec3 c2 = vec3(0.0, 0.6, 1.0);
                vec3 c3 = vec3(1.8, 1.8, 1.8);
                
                vec3 color = mix(c1, c2, vapor);
                color = mix(color, c3, core * (0.8 + vapor * 0.2));
                color += c2 * fresnel * 0.4;
                
                float alpha = (core * 1.6 + vapor * 0.8 + fresnel * 0.4) * uAlphaMult * softEdge * uGlobalAlpha;
                alpha = pow(alpha, 1.2) * vapor; 
                
                float edgeFade = smoothstep(0.0, 0.15, vUv.x) * smoothstep(1.0, 0.85, vUv.x);
                
                gl_FragColor = vec4(color, clamp(alpha * edgeFade, 0.0, 1.0));
            }
        `;

        // --- REVERSIÓN A LIGHTNING ORGÁNICO (EL QUE TENÍA CARÁCTER) ---
        const LIGHTNING_VS = `
            attribute float aRandom;
            attribute vec3 aOffset;
            varying vec2 vUv;
            varying float vRandom;
            varying float vLocalTime;
            void main() {
                vUv = uv;
                vRandom = aRandom;
                vLocalTime = aOffset.x;
                gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
            }
        `;

        const LIGHTNING_FS = `
            ${NOISE_GLSL}
            varying vec2 vUv;
            varying float vRandom;
            varying float vLocalTime;
            uniform float uTime;
            uniform vec3 uColor;
            uniform float uSpeedMult;
            uniform float uGlobalAlpha;

            void main() {
                vec2 uv = vUv;
                uv.x -= 0.5;
                float t = uTime * uSpeedMult * (1.0 + vRandom * 2.0) + vLocalTime;
                float noise = snoise(vec3(uv.y * 3.0, vRandom * 10.0, t)) * 0.3;
                noise += snoise(vec3(uv.y * 15.0, t * 1.5, 0.0)) * 0.08;
                float bend = sin(uv.y * 3.14159265 + vRandom * 5.0) * 0.2 * vRandom;
                float dist = abs(uv.x - noise - bend);
                float core = 0.001 / (dist + 0.00001);
                float glow = 0.005 / (dist + 0.001);
                float pulse = pow(sin(t * 8.0 + vRandom * 20.0) * 0.5 + 0.5, 15.0);
                float blackout = step(0.1, snoise(vec3(vRandom * 100.0, t * 0.2, 0.0)));
                float intensity = (core + glow) * pulse * blackout * uGlobalAlpha;
                intensity *= smoothstep(0.0, 0.1, uv.y) * smoothstep(1.0, 0.8, uv.y);
                if (intensity < 0.005) discard;
                vec3 finalColor = mix(uColor, vec3(1.5), core * 0.5);
                gl_FragColor = vec4(finalColor * intensity * 2.5, intensity);
            }
        `;

    // --- MAGICAL BEAM SHADERS (From Collision) ---
    const BEAM_VS = `
        ${NOISE_GLSL}
        varying vec2 vUv;
        varying float vDistToCore;
        varying float vNode;
        uniform float uTime;
        uniform float uSeed;
        uniform float uLayer;
        uniform float uClashOffset;

        void main() {
            vUv = uv;
            vec3 p = position;
            float t = uTime * 4.0;
            float node = smoothstep(0.4, 0.6, abs(sin(vUv.y * 3.0 + t * 0.2)));
            vNode = node;
            float compression = 1.0 - (node * 0.4);
            float macroFreq = (uLayer == 0.0) ? 0.1 : 0.3;
            float macroAmp = (uLayer == 0.0) ? 4.0 : 1.5;
            float noise = snoise(vec3(p.y * macroFreq, t * 0.4, uSeed));
            float snappedN = pow(abs(noise), 1.1) * sign(noise); 
            vDistToCore = smoothstep(0.4, 1.0, vUv.y);
            float gravityPull = pow(vDistToCore, 2.5);
            float erraticTime = t * 0.1 + snoise(vec3(0.0, t * 0.05, 0.0)) * 2.0;
            float twist = snoise(vec3(0.0, erraticTime, 0.0)) * gravityPull * 6.0;
            float cosT = cos(twist); float sinT = sin(twist);
            float nx = p.x * cosT - p.z * sinT;
            float nz = p.x * sinT + p.z * cosT;
            p.x = mix(p.x, nx, gravityPull);
            p.z = mix(p.z, nz, gravityPull);
            p.x += (snappedN * macroAmp) * compression + snoise(vec3(t * 10.0, erraticTime, 0.0)) * gravityPull * 4.0;
            p.z += (snoise(vec3(p.y * 0.5, t, uSeed + 1.0)) * macroAmp * 0.3 * compression);
            float tip = (uClashOffset + 25.0) / 50.0;
            float relProgress = clamp(vUv.y / tip, 0.0, 1.0);
            float tipConvergence = 1.0 - smoothstep(0.9, 1.0, relProgress);
            p.x *= tipConvergence; p.z *= tipConvergence;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
    `;

    const BEAM_FS = `
        ${NOISE_GLSL}
        varying vec2 vUv;
        varying float vDistToCore;
        varying float vNode;
        uniform vec3 uColor;
        uniform float uTime;
        uniform float uIntensity;
        uniform float uClashOffset;
        uniform float uBottomOffset;

        void main() {
            float d = abs(vUv.x - 0.5) * 2.0;
            float t = uTime * 25.0;
            float spine = smoothstep(0.02, 0.0, d);
            float bite = step(0.98, snoise(vec3(vUv.y * 10.0, t * 0.5, 0.0)));
            float n = 1.0 - abs(snoise(vec3(vUv.y * 25.0 + t, vUv.x * 4.0, t * 0.2)));
            float sharp = pow(n, 12.0);
            float thickness = 0.005 + vNode * 0.03 + bite * 0.1;
            float tip = (uClashOffset + 25.0) / 50.0;
            float bottom = (uBottomOffset + 25.0) / 50.0;
            if(vUv.y > tip || vUv.y < bottom) discard;
            float relProgress = clamp(vUv.y / tip, 0.0, 1.0);
            float tipFade = smoothstep(1.0, 0.97, relProgress);
            float mask = smoothstep(thickness * tipFade, 0.0, d - sharp * 0.2);
            float glow = exp(-d * 18.0) * (sharp + vNode) * tipFade;
            vec3 col = mix(uColor, vec3(20.0), mask + spine);
            float bottomFade = smoothstep(0.0, 0.05, (vUv.y - bottom) / max(0.01, tip - bottom));
            float xFade = smoothstep(0.0, 0.15, vUv.y) * tipFade * bottomFade;
            gl_FragColor = vec4(col * (mask * 10.0 + spine * 25.0 + glow * 5.0), (mask + glow + spine) * xFade);
        }
    `;

        let scene, camera, renderer, composer;
        let layers = [], lightningGroups = [], sparks;
        let mainBeam;
        let forcefieldRoot; // Grupo para controlar visibilidad del escudo
        let spellActive = false, progress = 0, progressBottom = 0;
        let defenseActive = false, defenseAlpha = 0; // Estado y animación del escudo
        let defenseTimer = null; // Temporizador para el escudo
        let controls, clock = new THREE.Clock();

        class MagicalBeam {
            constructor(scene, color) {
                this.group = new THREE.Group();
                this.mats = [];
                this.addLayer(0.2, color, 0); 
                this.addLayer(0.4, color, 1);
                this.addLayer(0.6, color, 2);
                this.group.rotation.z = -Math.PI / 2; // Apuntar hacia la derecha
                this.group.position.x = 0;
                scene.add(this.group);
            }
            addLayer(radius, color, layerId) {
                const mat = new THREE.ShaderMaterial({
                    vertexShader: BEAM_VS, fragmentShader: BEAM_FS,
                    uniforms: {
                        uTime: { value: 0 }, uColor: { value: new THREE.Color(color) },
                        uLayer: { value: layerId }, uSeed: { value: Math.random() * 100 },
                        uIntensity: { value: 3.5 }, uClashOffset: { value: -25 }, uBottomOffset: { value: -25 }
                    },
                    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
                });
                const geo = new THREE.CylinderGeometry(radius, radius, 50, 16, 512, true);
                const mesh = new THREE.Mesh(geo, mat);
                this.group.add(mesh);
                this.mats.push(mat);
            }
            update(t, offset, bottom, intensity = 3.5) {
                this.mats.forEach(m => {
                    m.uniforms.uTime.value = t;
                    m.uniforms.uClashOffset.value = offset;
                    m.uniforms.uBottomOffset.value = bottom;
                    m.uniforms.uIntensity.value = intensity;
                });
            }
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            // No seteamos la posición x aquí todavía, lo haremos en updateLayout
            camera.position.set(0, 0, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const renderPass = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 1.2, 0.05);
            const distortionPass = new ShaderPass(DISTORTION_SHADER);
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass); composer.addPass(bloomPass); composer.addPass(distortionPass);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            function updateLayout() {
                // Desplazamos el visor al 48% (casi el límite del 50%) para pegarlo al borde
                const shiftX = window.innerWidth * 0.48;
                camera.setViewOffset(
                    window.innerWidth, window.innerHeight,
                    -shiftX, 0,
                    window.innerWidth, window.innerHeight
                );
            }
            updateLayout();
            window._updateLayout = updateLayout;

            forcefieldRoot = new THREE.Group();
            forcefieldRoot.visible = false;
            scene.add(forcefieldRoot);

            // FOG
            const fogMat = new THREE.ShaderMaterial({
                vertexShader: `varying vec3 vP; void main() { vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
                fragmentShader: `${NOISE_GLSL} varying vec3 vP; uniform float uT; void main() { 
                    float n = snoise(vP*0.1 + uT*0.03);
                    gl_FragColor = vec4(0.0, 0.02, 0.1, smoothstep(0.5, 0.9, n)*0.3);
                }`,
                transparent: true, depthWrite: false, side: THREE.BackSide, uniforms: { uT: { value: 0 } }
            });
            forcefieldRoot.add(new THREE.Mesh(new THREE.SphereGeometry(15, 32, 32), fogMat));

            // PLASMA LAYERS (Fenómeno Imposible)
            const createLayer = (r, t, rotate, vary, alpha) => {
                const mat = new THREE.ShaderMaterial({
                    vertexShader: PLASMA_VS, fragmentShader: PLASMA_FS,
                    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
                    uniforms: { 
                        uTime: { value: 0 }, uVary: { value: vary }, 
                        uAlphaMult: { value: alpha }, uGlobalAlpha: { value: 0 } 
                    }
                });
                const mesh = new THREE.Mesh(new THREE.TorusGeometry(r, t, 64, 128, Math.PI), mat);
                mesh.rotation.set(rotate[0], rotate[1], rotate[2]);
                forcefieldRoot.add(mesh);
                return mesh;
            };
            layers.push(createLayer(3.5, 0.4, [0, 0, Math.PI/2], 0.2, 1.0));
            layers.push(createLayer(3.8, 1.2, [0.2, 0.1, Math.PI/2], 0.8, 0.3));
            layers.push(createLayer(3.2, 0.8, [-0.3, -0.2, Math.PI/2 + 0.5], 0.5, 0.2));

            // REVERSIÓN DE RAYOS (Lógica de Clusters y Desfase Temporal)
            const noise = new ImprovedNoise();
            const heroMat = new THREE.ShaderMaterial({
                vertexShader: LIGHTNING_VS, fragmentShader: LIGHTNING_FS,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
                uniforms: { 
                    uTime: { value: 0 }, uColor: { value: new THREE.Color(0xaaffff) }, 
                    uSpeedMult: { value: 0.5 }, uGlobalAlpha: { value: 0 } 
                }
            });
            lightningGroups.push(createClusteredLightning(heroMat, 12, { scale: [2, 5], noise, density: 0.8 }));

            const secondaryMat = heroMat.clone();
            secondaryMat.uniforms.uColor.value.set(0x44ccff);
            secondaryMat.uniforms.uSpeedMult.value = 1.2;
            lightningGroups.push(createClusteredLightning(secondaryMat, 40, { scale: [1, 2.5], noise, density: 0.5 }));

            const microMat = heroMat.clone();
            microMat.uniforms.uColor.value.set(0x0044ff);
            microMat.uniforms.uSpeedMult.value = 3.0;
            lightningGroups.push(createClusteredLightning(microMat, 150, { scale: [0.2, 0.8], noise, density: 0.3 }));

            lightningGroups.forEach(g => forcefieldRoot.add(g));

            mainBeam = new MagicalBeam(scene, '#00aaff');

            sparks = createViolentSparks();
            forcefieldRoot.add(sparks);

            window.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowRight' && !spellActive) {
                    spellActive = true;
                    progress = 0;
                    progressBottom = 0;
                }
                if(e.key === 'ArrowLeft') {
                    if (defenseTimer) clearTimeout(defenseTimer);
                    defenseActive = true;
                    forcefieldRoot.visible = true;
                    defenseTimer = setTimeout(() => {
                        defenseActive = false;
                        forcefieldRoot.visible = false;
                        defenseTimer = null;
                    }, 5000);
                }
            });

            animate();
        }

        function createClusteredLightning(mat, count, cfg) {
            const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1, 1, 16), mat, count);
            const dummy = new THREE.Object3D();
            const randoms = new Float32Array(count);
            const offsets = new Float32Array(count * 3);
            let i = 0, attempts = 0;
            while (i < count && attempts < count * 20) {
                const angle = Math.PI / 2 + (Math.random() * Math.PI);
                const r = 3.5 + (Math.random() - 0.5) * 1.5;
                const d = cfg.noise.noise(Math.cos(angle) * 2, Math.sin(angle) * 2, attempts * 0.1);
                if (d < (cfg.density - 1.0)) { attempts++; continue; }
                dummy.position.set(Math.cos(angle) * r, Math.sin(angle) * r, (Math.random() - 0.5) * 1.0);
                const tx = -Math.sin(angle); const ty = Math.cos(angle);
                const baseRot = Math.atan2(ty, tx);
                const violentOffset = (Math.random() - 0.5) * 2.5;
                dummy.rotation.set(0, 0, baseRot + violentOffset);
                const s = cfg.scale[0] + Math.random() * (cfg.scale[1] - cfg.scale[0]);
                dummy.scale.set(s * 0.3, s, 1);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
                randoms[i] = Math.random();
                offsets[i*3] = Math.random() * 1000;
                i++; attempts++;
            }
            mesh.geometry.setAttribute('aRandom', new THREE.InstancedBufferAttribute(randoms, 1));
            mesh.geometry.setAttribute('aOffset', new THREE.InstancedBufferAttribute(offsets, 3));
            return mesh;
        }

        function createViolentSparks() {
            const count = 3000;
            const g = new THREE.BufferGeometry();
            const pos = new Float32Array(count*3), vel = new Float32Array(count*3), rnd = new Float32Array(count);
            for(let i=0; i<count; i++){
                const a = Math.PI/2 + Math.random()*Math.PI;
                pos[i*3]=Math.cos(a)*3.5; pos[i*3+1]=Math.sin(a)*3.5; pos[i*3+2]=(Math.random()-0.5)*2;
                vel[i*3]=5+Math.random()*15; vel[i*3+1]=(Math.random()-0.5)*5; vel[i*3+2]=(Math.random()-0.5)*5;
                rnd[i]=Math.random();
            }
            g.setAttribute('position', new THREE.BufferAttribute(pos,3));
            g.setAttribute('aVel', new THREE.BufferAttribute(vel,3));
            g.setAttribute('aRand', new THREE.BufferAttribute(rnd,1));
            return new THREE.Points(g, new THREE.ShaderMaterial({
                vertexShader:`attribute vec3 aVel; attribute float aRand; uniform float uT; uniform float uGlobalAlpha; varying float vA; void main(){
                    float l = fract(uT*0.5+aRand); // Revertido a 0.5 (velocidad original)
                    vec3 p = position + aVel*l; p.x += pow(l,2.0)*20.0;
                    vec4 mv = modelViewMatrix*vec4(p,1.0);
                    gl_PointSize = (10.0/-mv.z); gl_Position = projectionMatrix*mv;
                    vA = smoothstep(1.0, 0.7, l)*smoothstep(0.0, 0.1, l) * uGlobalAlpha;
                }`,
                fragmentShader:`varying float vA; void main(){ if(length(gl_PointCoord-0.5)>0.5) discard; gl_FragColor=vec4(0.5,0.8,1.0,vA); }`,
                transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, uniforms:{ uT:{value:0}, uGlobalAlpha:{value:0}}
            }));
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            // Animación de aparición/desaparición (Blur In/Out)
            const targetAlpha = defenseActive ? 1.0 : 0.0;
            defenseAlpha += (targetAlpha - defenseAlpha) * 0.12;
            forcefieldRoot.visible = defenseAlpha > 0.01;
            
            // El "Blur" lo simulamos con la intensidad de distorsión
            composer.passes[2].uniforms.uIntensity.value = 0.012 + (1.0 - defenseAlpha) * 0.08;
            
            if (spellActive) {
                const speed = 0.04;
                const fadeSpeed = 0.06;
                if (progress < 1.0) progress += speed;
                else if (progressBottom < 1.0) progressBottom += fadeSpeed;
                else { spellActive = false; progress = 0; progressBottom = 0; }
                
                // El forcefield tiene un radio de ~3.5. Solo chocamos si la defensa está activa.
                let rawPos = -25 + progress * 50;
                const clashPoint = -3.2; // Punto de impacto con el escudo
                const isClashing = defenseActive && (rawPos >= clashPoint);
                let currentPos = isClashing ? clashPoint : rawPos;
                
                let bottomPos = -25 + progressBottom * 50;
                
                // Si está chocando, aumentamos la violencia visual
                const intensity = isClashing ? (8.0 + Math.sin(time * 50.0) * 2.0) : 3.5;
                mainBeam.update(time, currentPos, bottomPos, intensity);
            } else {
                mainBeam.update(time, -25, -25);
            }

            layers.forEach(l => {
                l.material.uniforms.uTime.value = time;
                l.material.uniforms.uGlobalAlpha.value = defenseAlpha;
            });
            lightningGroups.forEach(g => {
                g.material.uniforms.uTime.value = time;
                g.material.uniforms.uGlobalAlpha.value = defenseAlpha;
            });
            sparks.material.uniforms.uT.value = time;
            sparks.material.uniforms.uGlobalAlpha.value = defenseAlpha;
            composer.passes[2].uniforms.uTime.value = time;
            controls.update();
            composer.render();
        }

        window.onload = init;
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
            if (window._updateLayout) window._updateLayout();
        };
    </script>
</body>

</html>

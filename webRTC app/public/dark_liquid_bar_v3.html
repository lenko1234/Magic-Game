
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#wrap { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 2.5rem 1.5rem; }
#bar-shell {
  width: 100%; max-width: 520px; height: 56px;
  border-radius: 6px; background: #04040a;
  border: 1px solid #1a0a2e; overflow: hidden; position: relative;
}
canvas#liq { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#btns { display: flex; gap: 10px; }
button {
  font-size: 12px; padding: 7px 20px; border-radius: 4px; cursor: pointer;
  border: 1px solid; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  background: transparent;
}
#btn-dmg { border-color: #4a1010; color: #7a2020; }
#btn-dmg:hover { background: #1a0505; color: #c03030; }
#btn-heal { border-color: #0a2a1a; color: #1a5a3a; }
#btn-heal:hover { background: #050f0a; color: #2a9a6a; }
</style>

<div id="wrap">
  <div id="bar-shell"><canvas id="liq"></canvas></div>
  <div id="btns">
    <button id="btn-dmg">daño</button>
    <button id="btn-heal">curar</button>
  </div>
</div>

<script>
const canvas = document.getElementById('liq');
const ctx = canvas.getContext('2d');
const shell = document.getElementById('bar-shell');
let W = shell.clientWidth, H = shell.clientHeight;
canvas.width = W; canvas.height = H;

let targetHp = 1.0, displayHp = 1.0;
let shakeAmt = 0;

const waves = [
  { ph: 0,   sp: 0.009,  amp: 2.8, fr: 0.018 },
  { ph: 1.3, sp: -0.007, amp: 2.0, fr: 0.031 },
  { ph: 3.1, sp: 0.011,  amp: 1.3, fr: 0.055 },
  { ph: 5.0, sp: -0.005, amp: 0.8, fr: 0.09  },
  { ph: 0.7, sp: 0.017,  amp: 0.5, fr: 0.14  },
];

let bubbles = [];
for (let i = 0; i < 12; i++) {
  bubbles.push({ x: Math.random()*W, y: H+Math.random()*H, r: 1+Math.random()*2, sp: 0.2+Math.random()*0.4, drift: (Math.random()-0.5)*0.2 });
}

let particles = [];

function getTheme(p) {
  if (p > 0.55) return { c1:'#0d1f0d', c2:'#112211', c3:'#0a3320', edge:'#1a7a44' };
  if (p > 0.3)  return { c1:'#1a0e00', c2:'#221400', c3:'#3a1e00', edge:'#9a5500' };
  return              { c1:'#1a0000', c2:'#2a0000', c3:'#3d0000', edge:'#aa1010' };
}

function waveY(x, baseY, extraAmp) {
  let y = baseY;
  for (const w of waves) y += Math.sin(x * w.fr + w.ph) * (w.amp + extraAmp);
  return y;
}

function addParticles(x, y, theme, n) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI/2 + (Math.random()-0.5)*1.4;
    const sp = 0.8 + Math.random()*2.5;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, r: 1.5+Math.random()*2.5, col: theme.edge, decay: 0.025+Math.random()*0.035 });
  }
}

function drawLayer(baseY, offsetY, color, extraAmp) {
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, waveY(0, baseY + offsetY, extraAmp));
  for (let x = 1; x <= W; x += 2) ctx.lineTo(x, waveY(x, baseY + offsetY, extraAmp));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function draw() {
  displayHp += (targetHp - displayHp) * 0.10;
  if (Math.abs(targetHp - displayHp) < 0.001) displayHp = targetHp;

  shakeAmt *= 0.88;

  for (const w of waves) w.ph += w.sp;

  const th = getTheme(displayHp);
  const baseY = H * (1 - displayHp) + (Math.random()-0.5) * shakeAmt;

  ctx.fillStyle = '#04040a';
  ctx.fillRect(0, 0, W, H);

  const extraAmp = shakeAmt * 0.15;

  drawLayer(baseY, 10, th.c1, extraAmp);
  drawLayer(baseY,  5, th.c2, extraAmp);
  drawLayer(baseY,  0, th.c3, extraAmp);

  ctx.beginPath();
  ctx.moveTo(0, waveY(0, baseY, extraAmp));
  for (let x = 1; x <= W; x += 2) ctx.lineTo(x, waveY(x, baseY, extraAmp));
  ctx.strokeStyle = th.edge;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.55;
  ctx.stroke();
  ctx.globalAlpha = 1;

  for (const b of bubbles) {
    const surfY = waveY(b.x, baseY, extraAmp);
    if (b.y > surfY + 1 && b.y < H) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.strokeStyle = th.edge;
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = 0.2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    b.y -= b.sp;
    b.x += b.drift;
    if (b.y < baseY - 4 || b.y < 0) {
      b.y = H + Math.random()*20;
      b.x = Math.random() * W;
    }
  }

  particles = particles.filter(p => p.life > 0.02);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= p.decay;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.1, p.r * p.life), 0, Math.PI*2);
    ctx.fillStyle = p.col;
    ctx.globalAlpha = p.life * 0.8;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (displayHp < 0.25) {
    const intensity = (0.25 - displayHp) / 0.25;
    if (Math.random() < intensity * 0.12) {
      shakeAmt = Math.max(shakeAmt, 3 + intensity * 5);
      const th2 = getTheme(displayHp);
      addParticles(Math.random()*W, waveY(Math.random()*W, baseY, extraAmp), th2, 2);
    }
  }

  requestAnimationFrame(draw);
}
draw();

document.getElementById('btn-dmg').addEventListener('click', function() {
  targetHp = Math.max(0, targetHp - 0.15);
  shakeAmt = 8;
  const th = getTheme(targetHp);
  addParticles(W*0.4 + Math.random()*W*0.2, H*(1-targetHp)+4, th, 9);
});

document.getElementById('btn-heal').addEventListener('click', function() {
  targetHp = Math.min(1, targetHp + 0.15);
  const th = getTheme(targetHp);
  addParticles(W*0.3 + Math.random()*W*0.3, H*(1-targetHp)+4, th, 7);
});
</script>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priori Incantatem - Organic Plasma</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010405;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            /* La fusión de gotas se maneja eficientemente en el shader (smin) */
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>




    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- LIBRERÍA DE RUIDO PARA GLSL ---
        const snoise3D = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }
        `;

        // --- CONFIGURACIÓN PRINCIPAL ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x010405, 30, 90);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 55);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(0.75); // Bajamos a 0.75 para reducir la carga de píxeles en pantallas 4K/Retina
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);



        // --- POST-PROCESAMIENTO ---
        const renderScene = new RenderPass(scene, camera);
        // Bajamos un poco el bloom para que el filtro gooey no se 'coma' los detalles
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2), 1.2, 0.4, 0.1);

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- MATERIALES Y SHADERS GLOBALES ---
        const colorVoldemort = new THREE.Color(0x00ff44);
        const colorHarry = new THREE.Color(0xff1100);

        const spellVertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const spellFragmentShader = `
            uniform float time;
            uniform vec3 beamColor;
            uniform float direction;
            varying vec2 vUv;
            ${snoise3D}
            void main() {
                vec2 uv = vUv;
                float speed = time * 8.0 * direction;
                float distY = abs(uv.y - 0.5);
                float noiseX = snoise(vec3(uv.x * 3.0 - speed, time * 5.0, 0.0)) * 0.08;
                float core = smoothstep(0.04, 0.0, abs((uv.y - 0.5) + noiseX));
                float turb = abs(snoise(vec3(uv.x * 5.0 - speed * 1.5, uv.y * 10.0, time * 8.0)));
                float electric = smoothstep(0.2, 0.0, turb + distY * 0.8);
                float aura = smoothstep(0.4, 0.0, distY) * 0.4;
                float alpha = max(core, max(electric, aura));
                alpha *= smoothstep(0.0, 0.15, uv.x) * smoothstep(1.0, 0.85, uv.x);
                vec3 finalColor = mix(beamColor, vec3(1.0), core * 1.5);
                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        const plasmaFragmentShader = `
            uniform float time;
            uniform vec3 colorL;
            uniform vec3 colorR;
            varying vec2 vUv;
            ${snoise3D}
            void main() {
                vec2 cUv = vUv * 2.0 - 1.0;
                float dist = length(cUv);
                vec2 dir = cUv / (dist + 0.0001);
                float angle = atan(dir.y, dir.x);
                float rays1 = sin(angle * 12.0 + time * 8.0) * 0.5 + 0.5;
                float rays2 = sin(angle * 18.0 - time * 6.0) * 0.5 + 0.5;
                float starburst = (rays1 * rays2) * smoothstep(1.0, 0.0, dist);
                float plasma1 = snoise(vec3(cUv * 2.0, time * 3.0));
                float plasma2 = snoise(vec3(cUv * 4.0, -time * 2.0));
                float plasmaCloud = (plasma1 * 0.5 + 0.5) * (plasma2 * 0.5 + 0.5);
                float boundary = cUv.x + plasma1 * 0.3;
                float mixFactor = smoothstep(-0.2, 0.2, boundary);
                vec3 color = mix(colorL, colorR, mixFactor);
                float centerWhite = smoothstep(0.3, 0.0, dist);
                color = mix(color, vec3(1.0), centerWhite);
                float alpha = smoothstep(1.0, 0.1, dist) * (plasmaCloud + starburst);
                gl_FragColor = vec4(color, alpha);
            }
        `;

        const flareFragmentShader = `
            varying vec2 vUv;
            void main() {
                vec2 uv = vUv * 2.0 - 1.0;
                float intensity = smoothstep(1.0, 0.0, abs(uv.y * 15.0)) * smoothstep(1.0, 0.0, abs(uv.x));
                gl_FragColor = vec4(1.0, 1.0, 0.9, intensity * 0.8);
            }
        `;

        // --- CONSTRUCCIÓN DE LA ESCENA ---
        const collisionGroup = new THREE.Group();
        scene.add(collisionGroup);

        const plasmaMat = new THREE.ShaderMaterial({
            vertexShader: spellVertexShader,
            fragmentShader: plasmaFragmentShader,
            uniforms: {
                time: { value: 0 },
                colorL: { value: colorVoldemort },
                colorR: { value: colorHarry }
            },
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const plasmaPlane = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), plasmaMat);
        collisionGroup.add(plasmaPlane);

        const whiteCore = new THREE.Mesh(
            new THREE.SphereGeometry(1.0, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        collisionGroup.add(whiteCore);

        const flareMat = new THREE.ShaderMaterial({
            vertexShader: spellVertexShader,
            fragmentShader: flareFragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const flare = new THREE.Mesh(new THREE.PlaneGeometry(60, 3), flareMat);
        collisionGroup.add(flare);

        const createSpellBeam = (color, startX, directionVal) => {
            const group = new THREE.Group();
            const beamGeo = new THREE.PlaneGeometry(40, 5, 64, 1);
            beamGeo.translate(directionVal * 20, 0, 0);
            const mat = new THREE.ShaderMaterial({
                vertexShader: spellVertexShader,
                fragmentShader: spellFragmentShader,
                uniforms: {
                    time: { value: 0 },
                    beamColor: { value: color },
                    direction: { value: directionVal }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const plane1 = new THREE.Mesh(beamGeo, mat);
            const plane2 = new THREE.Mesh(beamGeo, mat);
            plane2.rotation.x = Math.PI / 2;
            group.add(plane1);
            group.add(plane2);
            const coreGeo = new THREE.CylinderGeometry(0.04, 0.04, 40, 8);
            coreGeo.rotateZ(Math.PI / 2);
            coreGeo.translate(directionVal * 20, 0, 0);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending });
            group.add(new THREE.Mesh(coreGeo, coreMat));
            group.position.x = startX;
            return { group, mat };
        };

        const beamL = createSpellBeam(colorVoldemort, -1, -1.0);
        const beamR = createSpellBeam(colorHarry, 1, 1.0);
        scene.add(beamL.group);
        scene.add(beamR.group);

        // --- SISTEMA DE CHISPAS (GOTITAS PEQUEÑAS) ---
        class Spark {
            constructor() {
                this.radius = 0.03 + Math.random() * 0.07;
                this.geometry = new THREE.IcosahedronGeometry(this.radius, 1);
                this.material = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });
                this.mesh = new THREE.Mesh(this.geometry, this.material);
                scene.add(this.mesh);
                this.reset();
            }

            reset() {
                // Nacen a lo largo de los rayos (-40 a 40)
                const side = Math.random() > 0.5 ? 1 : -1;
                const xPos = (Math.random() * 40) * side;

                // Mayor dispersión inicial
                this.mesh.position.set(xPos, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);

                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.4,
                    (Math.random() - 0.5) * 0.6,
                    (Math.random() - 0.5) * 0.4
                );

                this.life = 1.0;
                this.decay = 0.4 + Math.random() * 0.5;

                // Color segúun el lado del rayo
                const color = xPos > 0 ? colorHarry : colorVoldemort;
                this.material.color.set(color);
            }

            update(ts = 1.0) {
                this.mesh.position.addScaledVector(this.velocity, ts);
                this.velocity.y -= 0.005 * ts;
                this.life -= (this.decay / 60) * ts;
                this.material.opacity = this.life;
                if (this.life <= 0 || Math.abs(this.mesh.position.x) > 40) this.reset();
            }
        }

        // --- SISTEMA DE RAYMARCHING PARA EL LÍQUIDO DEL MEDIO ---
        const LIQUID_SCALE = 0.5; // Factor de escala global para el líquido
        const MAX_BALLS = 150;
        const ballPositions = new Float32Array(MAX_BALLS * 3);
        const ballRadii = new Float32Array(MAX_BALLS);

        const raymarchFragShader = `
            precision highp float;
            varying vec2 vUv;
            uniform float uAspect;
            uniform vec3 uCamPos;
            uniform vec3 uBalls[${MAX_BALLS}];
            uniform float uRadii[${MAX_BALLS}];
            uniform int uCount;
            uniform vec3 colorL;
            uniform vec3 colorR;

            float smin(float a, float b, float k) {
                float h = max(k - abs(a - b), 0.0) / k;
                return min(a, b) - h * h * k * 0.25;
            }

            float sdSphere(vec3 p, vec3 c, float r) {
                return length(p - c) - r;
            }

                                    float sdBox(vec3 p, vec3 b) {
                vec3 q = abs(p) - b;
                return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
            }

            float field(vec3 p) {
                // Núcleo central líquido escalado
                float d = sdSphere(p, vec3(0.0, 0.0, 0.0), 1.5 * ${LIQUID_SCALE});
                
                float dDrops = 100.0;
                bool hasDrops = false;
                for (int i = 0; i < ${MAX_BALLS}; i++) {
                    if (i >= uCount) break;
                    float dSphere = sdSphere(p, uBalls[i], uRadii[i]);
                    // Fusión dinámica: débil en el centro (y=0), muy fuerte al caer (y < -15)
                    float dynamicK = mix(1.2, 5.5, smoothstep(0.0, -15.0, p.y));
                    dDrops = smin(dDrops, dSphere, dynamicK * 0.5);
                    hasDrops = true;
                }
                
                // Rayos laterales extremadamente finos (invisibles por sí solos)
                float rayL = sdBox(p - vec3(-22.0, 0.0, 0.0), vec3(20.0, 0.005, 0.005));
                float rayR = sdBox(p - vec3(22.0, 0.0, 0.0), vec3(20.0, 0.005, 0.005));
                float dRays = min(rayL, rayR);
                
                if (hasDrops) {
                    // Fusionamos las gotas con los rayos
                    float dCombined = smin(dDrops, dRays, 1.4 * ${LIQUID_SCALE});
                    // Fusionamos el resultado con el núcleo
                    d = smin(d, dCombined, 1.6 * ${LIQUID_SCALE});
                } else {
                    d = smin(d, dRays, 1.0 * ${LIQUID_SCALE}); // Prácticamente invisible
                }
                
                return d;
            }

            vec3 calcNormal(vec3 p) {
                vec2 e = vec2(0.01, 0.0);
                return normalize(vec3(
                    field(p+e.xyy) - field(p-e.xyy),
                    field(p+e.yxy) - field(p-e.yxy),
                    field(p+e.yyx) - field(p-e.yyx)
                ));
            }

            void main() {
                vec2 uv = vUv * 2.0 - 1.0;
                uv.x *= uAspect;
                
                vec3 ro = uCamPos;
                // Calculamos rd basado en la posición de la cámara relativa al centro
                vec3 forward = normalize(-ro);
                vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), forward));
                vec3 up = cross(forward, right);
                vec3 rd = normalize(forward * 2.0 + right * uv.x + up * uv.y);
                
                float t = 0.0;
                float hit = 0.0;
                // Reducimos pasos para compensar el aumento de gotas
                for (int i = 0; i < 35; i++) {
                    vec3 p = ro + rd * t;
                    float d = field(p);
                    if (d < 0.01) { hit = 1.0; break; }
                    if (t > 70.0) break;
                    t += d * 0.85;
                }

                if (hit < 0.5) discard;

                vec3 p = ro + rd * t;
                vec3 n = calcNormal(p);
                
                // Color basado en la posición X para el gradiente Harry/Voldemort
                float mixFactor = smoothstep(-2.0 * ${LIQUID_SCALE}, 2.0 * ${LIQUID_SCALE}, p.x);
                vec3 baseCol = mix(colorL, colorR, mixFactor);
                
                vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));
                float diff = max(dot(n, lightDir), 0.0);
                vec3 viewDir = normalize(ro - p);
                vec3 halfDir = normalize(lightDir + viewDir);
                float spec = pow(max(dot(n, halfDir), 0.0), 32.0);

                vec3 col = baseCol * (diff * 0.5 + 0.5) + vec3(1.0) * spec * 0.7;
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        const raymarchMat = new THREE.ShaderMaterial({
            vertexShader: spellVertexShader,
            fragmentShader: raymarchFragShader,
            transparent: true,
            uniforms: {
                uAspect: { value: window.innerWidth / window.innerHeight },
                uCamPos: { value: new THREE.Vector3(0, 0, 55) },
                uBalls: { value: ballPositions },
                uRadii: { value: ballRadii },
                uCount: { value: 0 },
                colorL: { value: colorHarry },
                colorR: { value: colorVoldemort }
            }
        });

        const raymarchQuad = new THREE.Mesh(new THREE.PlaneGeometry(60, 80), raymarchMat);
        scene.add(raymarchQuad);

        // Lógica de física para las gotas del Raymarching
        class LiquidDrop {
            constructor(isAmbient = true) {
                this.isAmbient = isAmbient;
                this.active = false; // Empezamos siempre desactivadas
                this.pos = new THREE.Vector3();
                this.vel = new THREE.Vector3();
                this.targetRadius = 0;
                this.radius = 0;
                // Si no es ambiental (formación), se resetea al nacer, 
                // pero las ambientales esperarán a ser llamadas.
                if (!isAmbient) this.reset(); 
            }
            reset() {
                if (!this.isAmbient) {
                    this.active = false;
                    return;
                }
                const side = Math.random() > 0.5 ? 1 : -1;
                // Ampliamos el rango en X (de 2 a 15) para que no nazcan todas en un solo punto
                this.pos.set((Math.random() - 0.5) * 15 * LIQUID_SCALE, (Math.random() - 0.5) * 2 * LIQUID_SCALE, 0);
                this.vel.set((0.05 + Math.random() * 0.15) * side * LIQUID_SCALE, (Math.random() - 0.5) * 0.1 * LIQUID_SCALE, (Math.random() - 0.5) * 0.05 * LIQUID_SCALE);
                this.targetRadius = (0.4 + Math.random() * 0.8) * LIQUID_SCALE;
                this.radius = this.targetRadius * 0.2; // Nacen pequeñas
                this.active = true;
                this.gravity = (0.002 + Math.random() * 0.003) * LIQUID_SCALE;
            }
            spawn(x, y, vx, vy, radius) {
                this.pos.set(x * LIQUID_SCALE, y * LIQUID_SCALE, 0);
                this.vel.set(vx * LIQUID_SCALE, vy * LIQUID_SCALE, (Math.random() - 0.5) * 0.05 * LIQUID_SCALE);
                this.targetRadius = radius * LIQUID_SCALE;
                this.radius = this.targetRadius * 0.2; // Nacen pequeñas
                this.active = true;
                this.gravity = (0.002 + Math.random() * 0.002) * LIQUID_SCALE;
            }
            update(ts = 1.0) {
                if (!this.active) return;
                this.pos.addScaledVector(this.vel, ts);
                this.vel.y -= this.gravity * ts;

                // Crecimiento gradual hasta alcanzar el radio objetivo
                if (this.radius < this.targetRadius) {
                    this.radius += (this.targetRadius * 0.02) * ts;
                }

                // Desaparecen solo al salir de los límites (principalmente por abajo)
                if (this.pos.y < -35 * LIQUID_SCALE || Math.abs(this.pos.x) > 60 * LIQUID_SCALE) {
                    if (this.isAmbient) this.reset();
                    else this.active = false;
                }
            }
        }

        class FormationEmitter {
            constructor(type, interval) {
                this.type = type;
                this.interval = interval;
                this.timer = 0;
            }
            update(pool, ts = 1.0) {
                this.timer += ts;
                if (this.timer >= this.interval) {
                    this.timer = 0;

                    // Disparamos un cluster (grupo) en lugar de una sola gota
                    const burstSize = 2 + Math.floor(Math.random() * 3); // 2 a 4 gotas
                    const burstX = (this.type === 'voldemort_side' ? -2 : this.type === 'harry_side' ? 2 : 0) + (Math.random() - 0.5) * 40;
                    const baseVx = this.type === 'voldemort_side' ? -0.15 : this.type === 'harry_side' ? 0.15 : 0;
                    const baseVy = (Math.random() - 0.5) * 0.1;

                    for (let i = 0; i < burstSize; i++) {
                        const drop = pool.find(d => !d.active && !d.isAmbient);
                        if (!drop) break;

                        // Variaciones mínimas para que el cluster se mantenga unido
                        const vx = baseVx + (Math.random() - 0.5) * 0.05;
                        const vy = baseVy + (Math.random() - 0.5) * 0.05;
                        const x = burstX + (Math.random() - 0.5) * 2;

                        drop.spawn(x, 0, vx, vy, 0.4 + Math.random() * 0.5);
                    }
                }
            }
        }

        const sparks = Array.from({ length: 50 }, () => new Spark());
        const liquidDrops = [];
        // Ajustamos cantidad de gotas: 60 ambientales + 90 para formaciones (Total 150)
        for (let i = 0; i < 60; i++) liquidDrops.push(new LiquidDrop(true));
        for (let i = 0; i < 90; i++) liquidDrops.push(new LiquidDrop(false));

        const formationEmitters = [
            new FormationEmitter('voldemort_side', 45), // Intervalo más largo para compensar el cluster
            new FormationEmitter('harry_side', 45),    // Intervalo más largo para compensar el cluster
        ];

        // --- INTERACTIVIDAD ---
        const timeScale = 1.4;
        let mouseX = 0, mouseY = 0;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            bloomPass.resolution.set(window.innerWidth / 2, window.innerHeight / 2);
            raymarchMat.uniforms.uAspect.value = camera.aspect;
        });

        const clock = new THREE.Clock();
        let ambientSpawnTimer = 0; // Temporizador para el nacimiento orgánico

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            camera.lookAt(0, 0, 0);

            beamL.mat.uniforms.time.value = time;
            beamR.mat.uniforms.time.value = time;
            plasmaMat.uniforms.time.value = time;

            plasmaPlane.quaternion.copy(camera.quaternion);
            flare.quaternion.copy(camera.quaternion);
            whiteCore.scale.setScalar(1.0 + Math.sin(time * 20) * 0.2);

            // Actualizar Chispas
            sparks.forEach(s => s.update(timeScale));

            // Nacimiento orgánico de gotas ambientales (una cada 12 cuadros aprox)
            ambientSpawnTimer += timeScale;
            if (ambientSpawnTimer >= 12) {
                ambientSpawnTimer = 0;
                const nextAmbient = liquidDrops.find(d => d.isAmbient && !d.active);
                if (nextAmbient) nextAmbient.reset();
            }

            // Actualizar Emisores de Formación
            formationEmitters.forEach(e => e.update(liquidDrops, timeScale));

            // Actualizar Líquido Raymarching
            let count = 0;
            // Aumentamos el multiplicador solo para LiquidDrop para que se vea más rápido (ej: 2.8 en lugar de 1.4)
            const liquidSpeed = 2.8;
            liquidDrops.forEach((d, i) => {
                d.update(liquidSpeed);
                if (d.active && count < MAX_BALLS) {
                    ballPositions[count * 3 + 0] = d.pos.x;
                    ballPositions[count * 3 + 1] = d.pos.y;
                    ballPositions[count * 3 + 2] = d.pos.z;
                    ballRadii[count] = d.radius;
                    count++;
                }
            });

            raymarchMat.uniforms.uCount.value = count;
            raymarchMat.uniforms.uCamPos.value.copy(camera.position);
            raymarchQuad.quaternion.copy(camera.quaternion);

            composer.render();
        }
        animate();
    </script>
</body>

</html>
